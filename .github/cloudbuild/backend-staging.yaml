steps:
  - name: node:20-alpine
    dir: backend
    entrypoint: sh
    secretEnv:
      - DIRECT_DATABASE_URL
    args:
      - -c
      - |
        set -eu
        npm ci
        npx prisma generate
        DATABASE_URL="$$DIRECT_DATABASE_URL" npx prisma migrate deploy

  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=backend/Dockerfile
      - --tag=${_IMAGE}
      - backend

images:
  - ${_IMAGE}

availableSecrets:
  secretManager:
    - versionName: projects/project-a2e260c1-839d-4f1d-b90/secrets/diewish-staging-direct-database-url/versions/latest
      env: DIRECT_DATABASE_URL

options:
  logging: CLOUD_LOGGING_ONLY
