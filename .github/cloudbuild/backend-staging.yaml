steps:
  - name: gcr.io/cloud-builders/git
    entrypoint: sh
    args:
      - -c
      - |
        set -eu
        git init /workspace/repo
        cd /workspace/repo
        git remote add origin https://github.com/DiyetisyenMehmet/ai-dietitian-platform.git
        git fetch --depth=1 origin "${_GIT_SHA}"
        git checkout --detach FETCH_HEAD
        test "$(git rev-parse HEAD)" = "${_GIT_SHA}"

  - name: node:20-alpine
    id: migrate-staging-database
    dir: /workspace/repo/backend
    entrypoint: sh
    secretEnv:
      - DIRECT_DATABASE_URL
    args:
      - -c
      - |
        set -eu
        npm ci
        npx prisma generate
        DATABASE_URL="$$DIRECT_DATABASE_URL" npx prisma migrate deploy

  - name: node:20-alpine
    id: seed-admin-foundation
    dir: /workspace/repo/backend
    entrypoint: sh
    secretEnv:
      - DIRECT_DATABASE_URL
    args:
      - -c
      - |
        set -eu
        # Seed only the deterministic RBAC registry/system-role mapping using
        # DB-only credentials. First-admin promotion remains separate.
        DATABASE_URL="$$DIRECT_DATABASE_URL" npm run admin:seed-foundation

  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=/workspace/repo/backend/Dockerfile
      - --tag=${_IMAGE}
      - /workspace/repo/backend

images:
  - ${_IMAGE}

availableSecrets:
  secretManager:
    - versionName: projects/project-a2e260c1-839d-4f1d-b90/secrets/diewish-staging-direct-database-url/versions/latest
      env: DIRECT_DATABASE_URL

options:
  logging: LEGACY
