steps:
  - name: gcr.io/cloud-builders/git
    entrypoint: sh
    args:
      - -c
      - |
        set -eu
        git init /workspace/repo
        cd /workspace/repo
        git remote add origin https://github.com/DiyetisyenMehmet/ai-dietitian-platform.git
        git fetch --depth=1 origin "${_GIT_SHA}"
        git checkout --detach FETCH_HEAD
        test "$(git rev-parse HEAD)" = "${_GIT_SHA}"
  - name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    entrypoint: python3
    args: [/workspace/repo/scripts/coach-sync-staging-preflight.py, --phase, build]
    env:
      - PROJECT_ID=project-a2e260c1-839d-4f1d-b90
      - GITHUB_REF=refs/heads/feature/staging-preview
options:
  logging: LEGACY
