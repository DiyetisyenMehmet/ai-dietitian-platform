steps:
  - name: gcr.io/cloud-builders/git
    entrypoint: sh
    args:
      - -c
      - |
        set -eu
        git init /workspace/repo
        cd /workspace/repo
        git remote add origin https://github.com/DiyetisyenMehmet/ai-dietitian-platform.git
        git fetch --depth=1 origin "${_GIT_SHA}"
        git checkout --detach FETCH_HEAD
        test "$(git rev-parse HEAD)" = "${_GIT_SHA}"

  - name: node:20-alpine
    dir: /workspace/repo/backend
    entrypoint: sh
    secretEnv:
      - DIRECT_DATABASE_URL
      - JWT_ACCESS_SECRET
      - JWT_REFRESH_SECRET
    args:
      - -c
      - |
        set -eu
        npm ci
        npx prisma generate
        DATABASE_URL="$DIRECT_DATABASE_URL" \
        JWT_ACCESS_SECRET="$JWT_ACCESS_SECRET" \
        JWT_REFRESH_SECRET="$JWT_REFRESH_SECRET" \
        DIEWISH_ENVIRONMENT=staging \
        ADMIN_BOOTSTRAP_CONFIRM=DIEWISH_STAGING_ADMIN_BOOTSTRAP \
        ADMIN_BOOTSTRAP_EMAIL_SHA256="${_ADMIN_EMAIL_SHA256}" \
        node --import tsx src/modules/admin/admin.bootstrap-first-super-admin.ts

availableSecrets:
  secretManager:
    - versionName: projects/project-a2e260c1-839d-4f1d-b90/secrets/diewish-staging-direct-database-url/versions/latest
      env: DIRECT_DATABASE_URL
    - versionName: projects/project-a2e260c1-839d-4f1d-b90/secrets/diewish-staging-jwt-access/versions/latest
      env: JWT_ACCESS_SECRET
    - versionName: projects/project-a2e260c1-839d-4f1d-b90/secrets/diewish-staging-jwt-refresh/versions/latest
      env: JWT_REFRESH_SECRET

options:
  logging: LEGACY
