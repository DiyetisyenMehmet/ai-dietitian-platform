name: APP6 isolated onboarding request check

on:
  push:
    branches:
      - test/app6-onboarding-meal-race-a1

permissions:
  contents: read

concurrency:
  group: app6-onboarding-request-isolated
  cancel-in-progress: false

jobs:
  isolated-onboarding:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: diewish
          POSTGRES_PASSWORD: diewish
          POSTGRES_DB: diewish_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U diewish -d diewish_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DIEWISH_ENVIRONMENT: test
      PORT: 4000
      DATABASE_URL: postgresql://diewish:diewish@127.0.0.1:5432/diewish_e2e?schema=public
      JWT_ACCESS_SECRET: browser-e2e-access-secret-012345678901234567890123456789
      JWT_REFRESH_SECRET: browser-e2e-refresh-secret-01234567890123456789012345678
      CORS_ORIGIN: http://127.0.0.1:3000
      APP_WEB_URL: http://127.0.0.1:3000
      LOG_LEVEL: silent
      BCRYPT_ROUNDS: 10
      RATE_LIMIT_MAX: 1000
      AUTH_RATE_LIMIT_MAX: 1000
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:4000/api
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      E2E_WEB_BASE_URL: http://127.0.0.1:3000
      E2E_API_BASE_URL: http://127.0.0.1:4000/api
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1558d93f37b37a6de9874ec23e7be4c9dfb90f42
      - name: Verify exact tested commit
        run: |
          test "$(git rev-parse HEAD)" = "1558d93f37b37a6de9874ec23e7be4c9dfb90f42"
          echo "APP6_TESTED_COMMIT: $(git rev-parse HEAD)"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Prepare backend
        working-directory: backend
        run: |
          npm ci
          npx prisma generate
          npx prisma migrate deploy
          npm run build
      - name: Start backend
        working-directory: backend
        run: |
          npm start > /tmp/diewish-backend.log 2>&1 &
          echo $! > /tmp/diewish-backend.pid
      - name: Wait for backend
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4000/api/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Prepare frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          # GitHub's Ubuntu image also registers Google's Chrome apt repository.
          # Playwright's --with-deps runs apt-get update even though it installs its
          # own pinned Chromium build. A temporarily inconsistent external Chrome
          # index must not make our application E2E gate flaky, so remove only that
          # unrelated runner repository before asking Playwright for OS libraries.
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f -iname '*google*chrome*' -delete
          npx playwright install --with-deps chromium
          npm run build
      - name: Start frontend
        working-directory: frontend
        run: |
          npm start -- -H 127.0.0.1 -p 3000 > /tmp/diewish-frontend.log 2>&1 &
          echo $! > /tmp/diewish-frontend.pid
      - name: Wait for frontend
        run: |
          for attempt in {1..45}; do
            if curl --fail --silent http://127.0.0.1:3000/register > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/diewish-frontend.log
          exit 1

      - name: Observe only meal request events without payload logging
        working-directory: frontend
        run: |
          cat > e2e/app6-onboarding-request-observer.spec.js <<'APP6_OBSERVER'
          const { test } = require("@playwright/test");
          test.beforeEach(async ({ page }) => {
            page.on("request", request => {
              if (request.method() === "POST" && new URL(request.url()).pathname === "/api/tracking/meals") {
                console.log("APP6_REQUEST: POST /api/tracking/meals observed");
              }
            });
            page.on("response", response => {
              if (response.request().method() === "POST" && new URL(response.url()).pathname === "/api/tracking/meals") {
                console.log("APP6_RESPONSE: meal POST HTTP " + response.status());
              }
            });
          });
          require("./onboarding-flow.spec.js");
          APP6_OBSERVER
      - name: Run only the fixed scenario three times without retries
        working-directory: frontend
        run: npx playwright test e2e/app6-onboarding-request-observer.spec.js --workers=1 --repeat-each=3 --retries=0 --reporter=line
      - name: Stop isolated local services
        if: always()
        run: |
          kill "$(cat /tmp/diewish-backend.pid)" || true
          kill "$(cat /tmp/diewish-frontend.pid)" || true
