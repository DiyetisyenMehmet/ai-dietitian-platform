name: Temporary lockfile refresh helper

on:
  push:
    branches:
      - work/main-multer-security

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/main-multer-security
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm install --package-lock-only --ignore-scripts
      - name: Commit generated lockfile
        working-directory: .
        run: |
          if git diff --quiet -- backend/package-lock.json; then
            echo "Lockfile already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package-lock.json
          git commit -m "chore(deps): refresh multer lockfile"
          git push origin HEAD:work/main-multer-security
