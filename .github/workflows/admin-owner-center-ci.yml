name: Admin Owner Center CI
on:
  push:
    branches: [feature/admin3-owner-control-center-system-health-a1]
permissions:
  contents: read
concurrency:
  group: admin-owner-center-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: diewish
          POSTGRES_PASSWORD: isolated-admin3-test
          POSTGRES_DB: admin3_test
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U diewish -d admin3_test'
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DIEWISH_ENVIRONMENT: test
      DATABASE_URL: postgresql://diewish:isolated-admin3-test@localhost:5432/admin3_test?schema=public
      JWT_ACCESS_SECRET: admin3-isolated-access-secret-01234567890123456789
      JWT_REFRESH_SECRET: admin3-isolated-refresh-secret-01234567890123456789
      LOG_LEVEL: silent
      BCRYPT_ROUNDS: 10
      RATE_LIMIT_MAX: 10000
      AUTH_RATE_LIMIT_MAX: 10000
      ADMIN_RATE_LIMIT_MAX: 10000
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm run type-check
      - run: npm run build
      - run: npm test
      - run: npm run test:integration
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_API_BASE_URL: /api
      E2E_WEB_BASE_URL: http://127.0.0.1:3042
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint frontend
        run: npm run lint
      - run: npm run type-check
      - run: npm run build
      - name: Select installed browser or install Playwright Chromium
        shell: bash
        run: |
          browser_path=$(command -v google-chrome || command -v chromium || true)
          if [ -n "$browser_path" ]; then
            echo "ADMIN_BROWSER_EXECUTABLE=$browser_path" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Admin browser and existing feature regressions
        run: npx playwright test --config playwright.admin-owner.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admin-owner-browser-evidence
          path: |
            frontend/test-results
            frontend/playwright-report
          if-no-files-found: warn
          retention-days: 7
