name: Configure Staging SMS Defense

on:
  workflow_dispatch:
  push:
    branches: [feature/staging-preview]
    paths:
      - .github/workflows/staging-sms-defense-configure.yml
      - scripts/configure-staging-sms-defense.sh

permissions:
  contents: read
  id-token: write

jobs:
  configure:
    if: github.ref == 'refs/heads/feature/staging-preview'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    env:
      PROJECT_ID: project-a2e260c1-839d-4f1d-b90
      PROJECT_NUMBER: "730419163638"
      DIEWISH_SMS_DEFENSE_MODE: AUDIT
      DIEWISH_SMS_DEFENSE_START_SCORE: "0.8"
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/730419163638/locations/global/workloadIdentityPools/github-actions/providers/diewish-staging
          service_account: diewish-staging-deployer@project-a2e260c1-839d-4f1d-b90.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
      - name: Configure staging SMS Defense in AUDIT mode
        run: bash scripts/configure-staging-sms-defense.sh
