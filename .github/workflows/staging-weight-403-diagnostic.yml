name: Staging Weight 403 Safe Diagnostic

on:
  push:
    branches:
      - feature/staging-preview
    paths:
      - .github/workflows/staging-weight-403-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose-weight-403:
    name: Capture safe weight gate envelope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Register, login, and inspect pre-onboarding weight response
        env:
          API_BASE_URL: https://staging.diewish.com/api
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto = require("node:crypto");

          const apiBase = process.env.API_BASE_URL;
          const runId = process.env.GITHUB_RUN_ID || String(Date.now());
          const email = `stage4-weight-diagnostic.${runId}.${Date.now()}@example.com`;
          const password = `Diag-${crypto.randomBytes(12).toString("hex")}Aa1`;

          async function jsonRequest(path, { method = "GET", token, body } = {}) {
            const headers = {};
            if (token) headers.authorization = `Bearer ${token}`;
            if (body !== undefined) headers["content-type"] = "application/json";
            const response = await fetch(`${apiBase}${path}`, {
              method,
              headers,
              body: body === undefined ? undefined : JSON.stringify(body),
            });
            let payload = null;
            const contentType = response.headers.get("content-type") || "";
            if (contentType.includes("application/json")) {
              payload = await response.json();
            } else {
              const text = await response.text();
              payload = { success: false, error: { code: "NON_JSON_RESPONSE", message: text.slice(0, 200) } };
            }
            return { status: response.status, payload };
          }

          function safeError(result) {
            return {
              status: result.status,
              success: result.payload?.success ?? null,
              error: {
                code: result.payload?.error?.code ?? null,
                message: result.payload?.error?.message ?? null,
              },
            };
          }

          const registration = await jsonRequest("/auth/register", {
            method: "POST",
            body: { email, password, fullName: "Stage4 Weight Diagnostic" },
          });
          if (registration.status !== 201 || registration.payload?.success !== true) {
            console.log("WEIGHT_RUNTIME_DIAGNOSTIC_REGISTER", JSON.stringify(safeError(registration)));
            process.exit(10);
          }

          const login = await jsonRequest("/auth/login", {
            method: "POST",
            body: { email, password },
          });
          if (login.status !== 200 || login.payload?.success !== true) {
            console.log("WEIGHT_RUNTIME_DIAGNOSTIC_LOGIN", JSON.stringify(safeError(login)));
            process.exit(11);
          }

          const token = login.payload?.data?.tokens?.accessToken;
          if (!token) {
            console.log("WEIGHT_RUNTIME_DIAGNOSTIC_LOGIN", JSON.stringify({
              status: login.status,
              success: login.payload?.success ?? null,
              error: { code: "ACCESS_TOKEN_MISSING", message: "Synthetic login returned no access token." },
            }));
            process.exit(12);
          }

          const weight = await jsonRequest("/tracking/weight", { token });
          const safe = safeError(weight);
          console.log("WEIGHT_RUNTIME_DIAGNOSTIC", JSON.stringify(safe));

          if (weight.status !== 403) process.exit(20);
          if (safe.success !== false) process.exit(21);
          if (!safe.error.code || !safe.error.message) process.exit(22);
          NODE
