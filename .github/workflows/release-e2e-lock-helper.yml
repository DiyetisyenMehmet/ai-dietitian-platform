name: Release E2E Lock Helper

on:
  push:
    branches:
      - work/release-e2e-security-5

permissions:
  contents: write

jobs:
  refresh-and-audit:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/release-e2e-security-5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Refresh frontend lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify audit
        run: npm audit --audit-level=high
      - name: Commit lockfile if changed
        working-directory: .
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current."
            exit 0
          fi
          git commit -m "chore(ci): lock Playwright test runtime"
          git push origin HEAD:work/release-e2e-security-5
