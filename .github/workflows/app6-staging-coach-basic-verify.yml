name: APP6 staging Coach basic verification

on:
  push:
    branches:
      - test/app6-staging-basic-verify-a1

permissions:
  contents: read
  actions: read

jobs:
  verify-deployed-coach:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1558d93f37b37a6de9874ec23e7be4c9dfb90f42
      - name: Verify exact tested commit and successful deployment prerequisites
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "1558d93f37b37a6de9874ec23e7be4c9dfb90f42"
          for run_id in 38090067239 38090066742 38090066762 38090066813; do
            record="$(curl --fail --silent --show-error -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
            jq -e '.head_sha == "1558d93f37b37a6de9874ec23e7be4c9dfb90f42" and .status == "completed" and .conclusion == "success"' >/dev/null <<<"$record"
          done
          echo "APP6_TESTED_COMMIT: 1558d93f37b37a6de9874ec23e7be4c9dfb90f42"
          echo "All exact-SHA gates and deployment are successful."
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Prepare browser without changing deployed resources
        working-directory: frontend
        run: |
          npm ci
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f -iname '*google*chrome*' -delete
          npx playwright install --with-deps chromium
      - name: Check only synthetic account Coach page and session basics
        working-directory: frontend
        run: |
          cat > e2e/app6-staging-coach-basic.spec.js <<'APP6_STAGING_SPEC'
          const { randomBytes } = require("node:crypto");
          const { test, expect } = require("@playwright/test");
          const base = "https://staging.diewish.com";
          const api = base + "/api";
          test.use({ screenshot: "off", trace: "off", video: "off" });
          
          test("APP6 deployed Coach opens with an authenticated synthetic session", async ({ page, request }) => {
            test.setTimeout(120000);
            const email = "app6.verify." + randomBytes(10).toString("hex") + "@example.invalid";
            const password = randomBytes(24).toString("base64url") + "aA1";
            const post = async (path, options) => {
              try { return await request.post(api + path, options); }
              catch { throw new Error("APP6 API transport failed; request credentials withheld"); }
            };
            const registration = await post("/auth/register", {
              data: { email, password, fullName: "Synthetic APP6 Verification User" },
            });
            expect(registration.status()).toBe(201);
            let data;
            try { data = (await registration.json()).data; }
            catch { throw new Error("APP6 registration response invalid; response credentials withheld"); }
            const headers = { authorization: "Bearer " + data.tokens.accessToken };
            for (const type of ["TERMS_OF_SERVICE", "MEDICAL_DISCLAIMER", "KVKK_EXPLICIT_CONSENT"]) {
              const consent = await post("/legal/consents", { headers, data: { type } });
              expect(consent.status()).toBe(200);
            }
            const onboarding = await post("/onboarding", {
              headers,
              data: {
                fullName: "Synthetic APP6 Verification User", dateOfBirth: "1990-05-20",
                gender: "PREFER_NOT_TO_SAY", heightCm: 175, currentWeightKg: 70, targetWeightKg: 65,
                activityLevel: "MODERATE", healthConditions: [], allergies: [],
                dietaryPreference: "OMNIVORE", dailyWaterGoalMl: 2500, workScheduleType: "REGULAR",
                usualWakeTime: "07:00", usualSleepTime: "23:00",
              },
            });
            expect(onboarding.status()).toBe(200);
            await page.goto(base + "/login");
            await page.getByLabel("E-posta").fill(email);
            await page.getByLabel("Şifre", { exact: true }).fill(password).catch(() => {
              throw new Error("APP6 password field unavailable; credentials withheld");
            });
            await page.getByRole("button", { name: "Giriş Yap", exact: true }).click();
            await expect(page).toHaveURL(/\/dashboard$/, { timeout: 30000 });
            expect((await page.context().cookies()).some(cookie =>
              cookie.name === "diewish_staging_refresh" && cookie.httpOnly && cookie.secure
            )).toBe(true);
            expect(await page.evaluate(() => localStorage.getItem("diewish.auth.session") === null)).toBe(true);
            const historyResponse = page.waitForResponse(response =>
              response.request().method() === "GET" && new URL(response.url()).pathname === "/api/ai-chat/conversations"
            );
            await page.goto(base + "/ai");
            expect((await historyResponse).status()).toBe(200);
            await expect(page.getByLabel("Mesaj", { exact: true })).toBeVisible({ timeout: 30000 });
            await expect(page.getByRole("button", { name: "Yeni Sohbet", exact: true })).toBeVisible();
            await expect(page.getByRole("navigation", { name: "Sohbetler" })).toBeVisible();
            await page.reload();
            await expect(page.getByLabel("Mesaj", { exact: true })).toBeVisible({ timeout: 30000 });
            await expect(page).toHaveURL(/\/ai$/);
            console.log("APP6_STAGING_BASIC: authenticated login, protected cookie, Coach history GET and reload verified");
          });
          APP6_STAGING_SPEC
          npx playwright test e2e/app6-staging-coach-basic.spec.js --workers=1 --retries=0 --reporter=line
