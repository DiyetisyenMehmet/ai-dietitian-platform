name: Hardening CI

on:
  push:
    branches:
      - fix/production-hardening
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hardening-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: diewish
          POSTGRES_PASSWORD: diewish
          POSTGRES_DB: diewish_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U diewish -d diewish_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://diewish:diewish@localhost:5432/diewish_test?schema=public
      JWT_ACCESS_SECRET: integration-access-secret-012345678901234567890123456789
      JWT_REFRESH_SECRET: integration-refresh-secret-01234567890123456789012345678
      LOG_LEVEL: silent
      BCRYPT_ROUNDS: 10
      RATE_LIMIT_MAX: 1000
      AUTH_RATE_LIMIT_MAX: 1000
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm test
      - run: npm run test:integration
      - run: npm run type-check
      - run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://example.invalid/api
          NEXT_PUBLIC_SITE_URL: https://example.invalid
