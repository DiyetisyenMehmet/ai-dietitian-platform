name: Hardening CI

on:
  push:
    branches:
      - fix/production-hardening
      - feature/android-native-scanner
      - feature/staging-preview
      - security/app12-zod-security-gate-a1
      - security/app12-test2-backend-readiness-a1
      - security/app12-g1-upload-mail-security-a1
      - feature/app-security-nextjs-15-5-28-a1
      - feature/app12-daily-journey-pro-a1
      - feature/mirmir-a4-direct-integration
      - feature/mirmir-final-animation-decision-a1
      - feature/mascot-dost-next-character-a1
      - feature/mascot-full-collection-a1
      - feature/mascot-mirmir-pilot-a1
      - feature/mascot-mirmir-motion-a2
      - feature/admin2-staff-password-b2-close-a1
      - feature/app5-bottom-nav-scroll-containment-a2
      - feature/app6-coach-event-driven-sync-p2-a1
      - feature/app7-coach-p2-safe-completion-a1
      - feature/app7-mobile-nutrition-onboarding-overflow-a1
      - feature/app7-nutrition-session-test-hardening-a1
      - feature/app6-coach-p2-listener-security-fix
      - feature/app6-coach-crossplatform-sync-p1-a1
      - security/braces-ghsa-2026-a1
      - feature/workmode2-dashboard-journey-compact-text-a1
      - feature/workmode2-dashboard-and-coach-modal-polish-a1
  workflow_dispatch:
    inputs:
      build_android_apk:
        description: "Explicitly package the debug APK after native security tests"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: hardening-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Dependency vulnerability gate
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.6.0"
    with:
      scan-args: |-
        --lockfile=backend/package-lock.json
        --lockfile=frontend/package-lock.json
      upload-sarif: false
      fail-on-vuln: true
    permissions:
      contents: read
      actions: read
      security-events: write

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: diewish
          POSTGRES_PASSWORD: diewish
          POSTGRES_DB: diewish_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U diewish -d diewish_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DIEWISH_ENVIRONMENT: test
      DATABASE_URL: postgresql://diewish:diewish@localhost:5432/diewish_test?schema=public
      JWT_ACCESS_SECRET: integration-access-secret-012345678901234567890123456789
      JWT_REFRESH_SECRET: integration-refresh-secret-01234567890123456789012345678
      LOG_LEVEL: silent
      BCRYPT_ROUNDS: 10
      RATE_LIMIT_MAX: 1000
      AUTH_RATE_LIMIT_MAX: 1000
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Verify braces GHSA depth guard
        run: node ../scripts/security-braces-depth-guard.cjs backend
      - name: Test compressed request parsing security contracts
        run: node --test tests/body-parser-security.test.mjs
      - name: Test upload middleware security contracts
        run: node --import tsx --test src/middleware/upload-security.test.ts
      - name: Test reference micronutrient normalization
        run: python3 ../scripts/nutrition-reference-sync.test.py
      - name: Validate Prisma schema
        run: npx prisma validate
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - name: Lint backend
        run: npm run lint
      - run: npm test
      - run: npm run test:integration
      - run: npm run type-check
      - run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Verify braces GHSA depth guard
        run: node ../scripts/security-braces-depth-guard.cjs frontend
      - name: Check History browser harness formatting
        run: npx prettier --check e2e/history-ui.spec.js
      - name: Check History browser harness whitespace
        shell: bash
        run: |
          set +e
          git diff --no-index --check /dev/null e2e/history-ui.spec.js
          status=$?
          set -e
          if [ "$status" -eq 1 ]; then
            exit 0
          fi
          exit "$status"
      - name: Test Zod 4 bounded collections and form resolver contracts
        run: node --test tests/zod-validation-security.test.cjs
      - name: Test Nutrition A1 data accuracy
        run: node --test tests/nutrition-home-a1-data.test.cjs
      - name: Test identity runtime and error recovery
        run: node --test tests/identity.test.cjs
      - name: Test notification lifecycle and web push guards
        run: node --test tests/notification-lifecycle.test.cjs tests/web-push-service-worker.test.cjs
      - name: Test Blood Test card coordinate contract
        run: node --test tests/dashboard-blood-test-card.test.cjs
      - name: Test Food and Progress card coordinate contract
        run: node --test tests/dashboard-live-feature-card.test.cjs
      - name: Test Dashboard card personalization contracts
        run: node --test tests/dashboard-card-personalization.test.cjs tests/mascot-preferences.test.cjs
      - name: Test Journey dashboard activation and daily source reliability
        env:
          TZ: Europe/Istanbul
        run: >-
          node --test
          tests/journey-engine.test.cjs
          tests/journey-sources.test.cjs
          tests/daily-health-data-reliability.test.cjs
          tests/sleep-account-isolation.test.cjs
          tests/journey-dashboard-activation.test.cjs
          tests/journey-compact-ui.test.cjs
          tests/journey-plan.test.cjs
      - name: Validate staging History runtime spec syntax
        run: node --check e2e/staging-history-runtime.spec.js
      - name: Test Coach event lifecycle and account isolation
        run: npm run test:coach-sync
      - name: Lint frontend
        run: npm run lint
      - name: Test History share formatter contracts
        run: >-
          npx playwright test
          e2e/history-share-text.spec.ts
          e2e/history-share-parity.spec.ts
          e2e/history-custom-comparison.spec.ts
          e2e/history-final-recovery.spec.ts
          --workers=1 --reporter=line
      - name: Test semantic icon source contracts
        run: npx playwright test e2e/semantic-icon-contract.spec.ts --workers=1 --reporter=line
      - name: Test micronutrient contracts
        run: npx playwright test e2e/micronutrient-contract.spec.ts --workers=1 --reporter=line
      - name: Test reports reconciliation contracts
        run: npx playwright test e2e/reports-reconciliation.spec.ts --workers=1 --reporter=line
      - run: npm run type-check
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: /api
          NEXT_PUBLIC_SITE_URL: https://example.invalid

      - name: Test Next security update auth and host routing regression
        run: >-
          node --test
          tests/auth-session-restore.test.cjs
          tests/android-google-auth.test.cjs
          tests/staging-host-routing.test.cjs
          tests/staging-host-routing.transport.cjs
      - name: Install browser for Admin password setup regression
        timeout-minutes: 8
        run: |
          set -euo pipefail
          # Azure's Ubuntu mirror stalled during this security verification.
          # Keep the runner's existing signed Ubuntu HTTPS fallback mirrors.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            grep -Fq 'https://archive.ubuntu.com/ubuntu/' /etc/apt/apt-mirrors.txt
            sudo sed -i '/azure[.]archive[.]ubuntu[.]com/d' /etc/apt/apt-mirrors.txt
          fi
          npx playwright install --with-deps chromium
      - name: Capture accepted staging branding baseline
        env:
          APPROVED_BRAND_PHASE: before
          APPROVED_BRAND_EVIDENCE_DIR: ${{ runner.temp }}/next-security-approved-brand
          APPROVED_BRAND_APP_DIRECTORY: ${{ runner.temp }}/next-security-brand-baseline/frontend
        run: |
          set -euo pipefail
          accepted=582c2352e1e868adc18e9e9faa4efcedc2ced063
          git fetch --no-tags --depth=1 origin "$accepted"
          git worktree add --detach "${RUNNER_TEMP}/next-security-brand-baseline" "$accepted"
          ln -s "$GITHUB_WORKSPACE/frontend/node_modules" "$APPROVED_BRAND_APP_DIRECTORY/node_modules"
          git worktree add --detach "${RUNNER_TEMP}/next-security-brand-candidate" HEAD
          ln -s "$GITHUB_WORKSPACE/frontend/node_modules" "${RUNNER_TEMP}/next-security-brand-candidate/frontend/node_modules"
          npx playwright test --config playwright.approved-brand.config.ts --reporter=line --grep "approved artwork, stable handoff"
      - name: Test approved branding and guest handoff after Next security update
        env:
          APPROVED_BRAND_EVIDENCE_DIR: ${{ runner.temp }}/next-security-approved-brand
          APPROVED_BRAND_APP_DIRECTORY: ${{ runner.temp }}/next-security-brand-candidate/frontend
        run: npx playwright test --config playwright.approved-brand.config.ts --reporter=line
      - name: Upload Next security branding comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: next-security-approved-brand
          path: ${{ runner.temp }}/next-security-approved-brand
          if-no-files-found: warn
      - name: Test nutrition session readiness without accounts or AI
        run: npx playwright test e2e/nutrition-session-check.spec.ts --workers=1 --reporter=line
      - name: Test Mirmir default blink and retired video
        run: npx playwright test --config playwright.mirmir-video.config.ts
      - name: Upload Mirmir final mascot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mirmir-video-browser-evidence
          path: frontend/test-results/mirmir-video/
          if-no-files-found: ignore
          retention-days: 14
      - name: Test mobile meal text and onboarding time entry
        run: npx playwright test --config playwright.mobile-overflow.config.ts
      - name: Upload mobile overflow browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-overflow-browser-evidence
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Test branded Admin password setup and action isolation
        run: npx playwright test --config playwright.admin-password.config.ts

  android-native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Verify invalid staging URL is rejected
        shell: bash
        run: |
          set -euo pipefail
          if gradle --no-daemon -p android :app:help -PDIEWISH_WEB_BASE_URL=https://staging.invalid > /tmp/diewish-staging-url-guard.log 2>&1; then
            echo "Unsafe Android staging URL unexpectedly passed Gradle validation." >&2
            exit 1
          fi
          grep -Fq 'Refusing to build a staging APK' /tmp/diewish-staging-url-guard.log
      - name: Test Android notification and alarm guards
        run: gradle --no-daemon -p android :app:testDebugUnitTest -PDIEWISH_WEB_BASE_URL=https://staging.diewish.com
      - name: Build current-SHA debug APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_android_apk }}
        run: gradle --no-daemon -p android :app:assembleDebug -PDIEWISH_WEB_BASE_URL=https://staging.diewish.com
      - name: Verify compiled staging APK URL
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_android_apk }}
        shell: bash
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          build_config="$(find android/app/build/generated -type f -path '*/debug/*/BuildConfig.java' -print -quit)"
          test -n "$build_config"
          grep -Fq 'WEB_BASE_URL = "https://staging.diewish.com"' "$build_config"
          dex="$(mktemp)"
          trap 'rm -f "$dex"' EXIT
          unzip -p "$apk" 'classes*.dex' > "$dex"
          grep -aFq 'https://staging.diewish.com' "$dex"
          if grep -aFq 'staging.invalid' "$dex"; then
            echo "Unsafe staging.invalid URL found in the compiled APK." >&2
            exit 1
          fi
          echo "VERIFIED_APK_WEB_BASE_URL=https://staging.diewish.com"
      - name: Stamp current-SHA APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_android_apk }}
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::7}"
          mkdir -p android/app/build/traceable-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk "android/app/build/traceable-apk/Diewish-hardening-${short_sha}.apk"
          sha256sum "android/app/build/traceable-apk/Diewish-hardening-${short_sha}.apk" > "android/app/build/traceable-apk/Diewish-hardening-${short_sha}.sha256"
          cat "android/app/build/traceable-apk/Diewish-hardening-${short_sha}.sha256"
      - name: Upload current-SHA debug APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_android_apk }}
        uses: actions/upload-artifact@v4
        with:
          name: diewish-hardening-debug-apk-${{ github.run_number }}
          path: android/app/build/traceable-apk/
          if-no-files-found: error
          retention-days: 14

  browser-e2e:
    # Keep browser regression coverage running even when the independent
    # dependency vulnerability gate is red. Hardening CI still remains failed,
    # so staging deploy continues to fail closed until every required gate passes.
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: diewish
          POSTGRES_PASSWORD: diewish
          POSTGRES_DB: diewish_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U diewish -d diewish_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DIEWISH_ENVIRONMENT: test
      PORT: 4000
      COACH_SYNC_ENABLED: "true"
      DATABASE_URL: postgresql://diewish:diewish@127.0.0.1:5432/diewish_e2e?schema=public
      JWT_ACCESS_SECRET: browser-e2e-access-secret-012345678901234567890123456789
      JWT_REFRESH_SECRET: browser-e2e-refresh-secret-01234567890123456789012345678
      CORS_ORIGIN: http://127.0.0.1:3000
      APP_WEB_URL: http://127.0.0.1:3000
      LOG_LEVEL: silent
      BCRYPT_ROUNDS: 10
      RATE_LIMIT_MAX: 1000
      AUTH_RATE_LIMIT_MAX: 1000
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_API_BASE_URL: /api
      DIEWISH_API_PROXY_TARGET: http://127.0.0.1:4000
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      E2E_WEB_BASE_URL: http://127.0.0.1:3000
      E2E_API_BASE_URL: http://127.0.0.1:4000/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Prepare backend
        working-directory: backend
        run: |
          npm ci
          npx prisma generate
          npx prisma migrate deploy
          npm run build
      - name: Start backend
        working-directory: backend
        run: |
          node dist/index.js > /tmp/diewish-backend.log 2>&1 &
          echo $! > /tmp/diewish-backend.pid
      - name: Wait for backend
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4000/api/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/diewish-backend.log
          exit 1
      - name: Prepare frontend and Chromium
        timeout-minutes: 10
        working-directory: frontend
        run: |
          npm ci
          # GitHub's Ubuntu image also registers Google's Chrome apt repository.
          # Playwright's --with-deps runs apt-get update even though it installs its
          # own pinned Chromium build. A temporarily inconsistent external Chrome
          # index must not make our application E2E gate flaky, so remove only that
          # unrelated runner repository before asking Playwright for OS libraries.
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f -iname '*google*chrome*' -delete
          # Azure's Ubuntu mirror stalled during this security verification.
          # Keep the runner's existing signed Ubuntu HTTPS fallback mirrors.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            grep -Fq 'https://archive.ubuntu.com/ubuntu/' /etc/apt/apt-mirrors.txt
            sudo sed -i '/azure[.]archive[.]ubuntu[.]com/d' /etc/apt/apt-mirrors.txt
          fi
          npx playwright install --with-deps chromium webkit
          npm run build
      - name: Test Dashboard viewport overflow and scroll containment (63 scenarios)
        working-directory: frontend
        run: node --test tests/dashboard-viewport-layout.test.cjs
      - name: Start frontend
        working-directory: frontend
        run: |
          npm start -- -H 127.0.0.1 -p 3000 > /tmp/diewish-frontend.log 2>&1 &
          echo $! > /tmp/diewish-frontend.pid
      - name: Wait for frontend
        run: |
          for attempt in {1..45}; do
            if curl --fail --silent http://127.0.0.1:3000/register > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/diewish-frontend.log
          exit 1
      - name: Run targeted Dashboard card personalization E2E
        working-directory: frontend
        run: >-
          npx playwright test
          e2e/dashboard-card-personalization.spec.ts
          e2e/dashboard-edit-polish.spec.ts
          e2e/dashboard-and-coach-modal-polish.spec.ts
          e2e/dashboard-edit-sanity.spec.ts
          e2e/mascot-preferences.spec.ts
          --workers=1 --reporter=line
      - name: Isolate broad browser suite request budget
        working-directory: frontend
        run: |
          # UI preference probes share the runner's loopback address. Keep
          # suites independent without raising or disabling application limits.
          test "$NODE_ENV" = test
          test "$DIEWISH_ENVIRONMENT" = test
          curl --silent --show-error --dump-header - --output /dev/null http://127.0.0.1:4000/api/health | grep -Ei '^HTTP/|^RateLimit-'
          browser_backend=$(cat /tmp/diewish-backend.pid)
          kill "$browser_backend"
          for attempt in {1..15}; do
            if ! kill -0 "$browser_backend" 2>/dev/null; then break; fi
            sleep 1
          done
          ! kill -0 "$browser_backend" 2>/dev/null
          node ../backend/dist/index.js > /tmp/diewish-backend.log 2>&1 &
          echo $! > /tmp/diewish-backend.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4000/api/health > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent --show-error --dump-header - --output /dev/null http://127.0.0.1:4000/api/health | grep -Ei '^HTTP/|^RateLimit-'
      - name: Run browser smoke
        working-directory: frontend
        run: >-
          npx playwright test
          e2e/onboarding-flow.spec.js
          e2e/auth-entry-points.spec.js
          e2e/history-data.spec.ts
          e2e/history-share-text.spec.ts
          e2e/history-share-parity.spec.ts
          e2e/history-custom-comparison.spec.ts
          e2e/history-final-recovery.spec.ts
          e2e/history-ui.spec.js
          e2e/semantic-icon-browser.spec.js
          e2e/dashboard-blood-test-card.spec.ts
          e2e/dashboard-live-feature-card.spec.ts
          e2e/dashboard-card-personalization.spec.ts
          e2e/blood-test-longitudinal-comparison.spec.ts
          e2e/admin-foundation.spec.js
          e2e/admin-shell.spec.js
          e2e/admin-users.spec.js
          e2e/admin-user-operations.spec.js
          e2e/admin-subscription.spec.js
          e2e/admin-entitlement-operations.spec.js
          --workers=1 --reporter=line
      - name: Run Coach event synchronization in Chromium and WebKit across three servers
        working-directory: frontend
        run: |
          # Keep the existing browser suite's loopback rate bucket independent
          # from the new three-client suite. Restart only this hermetic test
          # process; leave database history, limits and all assertions intact.
          curl --silent --show-error --dump-header - --output /dev/null http://127.0.0.1:4000/api/health | grep -Ei '^HTTP/|^RateLimit-'
          coach_a=$(cat /tmp/diewish-backend.pid)
          kill "$coach_a"
          for attempt in {1..15}; do
            if ! kill -0 "$coach_a" 2>/dev/null; then break; fi
            sleep 1
          done
          ! kill -0 "$coach_a" 2>/dev/null
          node ../backend/dist/index.js > /tmp/diewish-backend.log 2>&1 &
          echo $! > /tmp/diewish-backend.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4000/api/health > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent --show-error --dump-header - --output /dev/null http://127.0.0.1:4000/api/health | grep -Ei '^HTTP/|^RateLimit-'
          PORT=4001 node ../backend/dist/integration/helpers/coach-server.js > /tmp/coach-server-b.log 2>&1 &
          coach_b=$!
          PORT=4002 node ../backend/dist/integration/helpers/coach-server.js > /tmp/coach-server-c.log 2>&1 &
          coach_c=$!
          trap 'kill "$coach_b" "$coach_c" 2>/dev/null || true' EXIT
          for port in 4001 4002; do
            ready=false
            for attempt in {1..30}; do
              if curl --fail --silent "http://127.0.0.1:${port}/api/health" > /dev/null; then ready=true; break; fi
              sleep 1
            done
            test "$ready" = true
          done
          npx playwright test e2e/coach-event-driven.spec.ts --workers=1 --reporter=line
      - name: Test updated Journey Pro real-plan actions and mobile layout (16 scenarios)
        working-directory: frontend
        run: npx playwright test --config=playwright.journey-pro.config.ts --reporter=line
      - name: Upload Journey Pro browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journey-pro-hardening-browser-${{ github.run_number }}
          path: frontend/test-results/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload Blood Test card browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blood-test-card-browser-${{ github.run_number }}
          path: frontend/test-results/blood-test-card/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload Food and Progress card browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-live-feature-card-browser-${{ github.run_number }}
          path: frontend/test-results/dashboard-live-feature-card/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload Mirmir pilot browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mirmir-pilot-browser-${{ github.run_number }}
          path: |
            frontend/test-results/e2e-mascot-preferences-*/
            frontend/test-results/e2e-onboarding-flow-*/error-context.md
            frontend/test-results/e2e-semantic-icon-browser-*/error-context.md
          if-no-files-found: warn
          retention-days: 7
      - name: Print service logs on failure
        if: failure()
        run: |
          curl --silent --show-error --dump-header - --output /dev/null http://127.0.0.1:4000/api/health | grep -Ei '^HTTP/|^RateLimit-' || true
          echo "--- backend ---"
          cat /tmp/diewish-backend.log || true
          echo "--- frontend ---"
          cat /tmp/diewish-frontend.log || true
      - name: Stop local services
        if: always()
        run: |
          if [ -f /tmp/diewish-frontend.pid ]; then kill "$(cat /tmp/diewish-frontend.pid)" || true; fi
          if [ -f /tmp/diewish-backend.pid ]; then kill "$(cat /tmp/diewish-backend.pid)" || true; fi
