name: Hardening CI

on:
  push:
    branches:
      - fix/production-hardening
      - feature/android-native-scanner
      - feature/staging-preview
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hardening-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Dependency vulnerability gate
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.6.0"
    with:
      scan-args: |-
        --lockfile=backend/package-lock.json
        --lockfile=frontend/package-lock.json
      upload-sarif: false
      fail-on-vuln: true
    permissions:
      contents: read
      actions: read
      security-events: write

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: diewish
          POSTGRES_PASSWORD: diewish
          POSTGRES_DB: diewish_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U diewish -d diewish_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DIEWISH_ENVIRONMENT: test
      DATABASE_URL: postgresql://diewish:diewish@localhost:5432/diewish_test?schema=public
      JWT_ACCESS_SECRET: integration-access-secret-012345678901234567890123456789
      JWT_REFRESH_SECRET: integration-refresh-secret-01234567890123456789012345678
      LOG_LEVEL: silent
      BCRYPT_ROUNDS: 10
      RATE_LIMIT_MAX: 1000
      AUTH_RATE_LIMIT_MAX: 1000
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Validate Prisma schema
        run: npx prisma validate
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - name: Lint backend
        run: npm run lint
      - run: npm test
      - run: npm run test:integration
      - run: npm run type-check
      - run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Check History browser harness formatting
        run: npx prettier --check e2e/history-ui.spec.js
      - name: Check History browser harness whitespace
        shell: bash
        run: |
          set +e
          git diff --no-index --check /dev/null e2e/history-ui.spec.js
          status=$?
          set -e
          if [ "$status" -eq 1 ]; then
            exit 0
          fi
          exit "$status"
      - name: Test identity runtime and error recovery
        run: node --test tests/identity.test.cjs
      - name: Test notification lifecycle and web push guards
        run: node --test tests/notification-lifecycle.test.cjs tests/web-push-service-worker.test.cjs
      - name: Validate staging History runtime spec syntax
        run: node --check e2e/staging-history-runtime.spec.js
      - run: npm run type-check
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://example.invalid/api
          NEXT_PUBLIC_SITE_URL: https://example.invalid

  android-native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Verify invalid staging URL is rejected
        shell: bash
        run: |
          set -euo pipefail
          if gradle --no-daemon -p android :app:help -PDIEWISH_WEB_BASE_URL=https://staging.invalid > /tmp/diewish-staging-url-guard.log 2>&1; then
            echo "Unsafe Android staging URL unexpectedly passed Gradle validation." >&2
            exit 1
          fi
          grep -Fq 'Refusing to build a staging APK' /tmp/diewish-staging-url-guard.log
      - name: Test Android notification and alarm guards
        run: gradle --no-daemon -p android :app:testDebugUnitTest -PDIEWISH_WEB_BASE_URL=https://staging.diewish.com
      - name: Build current-SHA debug APK
        run: gradle --no-daemon -p android :app:assembleDebug -PDIEWISH_WEB_BASE_URL=https://staging.diewish.com
      - name: Verify compiled staging APK URL
        shell: bash
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          build_config="$(find android/app/build/generated -type f -path '*/debug/*/BuildConfig.java' -print -quit)"
          test -n "$build_config"
          grep -Fq 'WEB_BASE_URL = "https://staging.diewish.com"' "$build_config"
          dex="$(mktemp)"
          trap 'rm -f "$dex"' EXIT
          unzip -p "$apk" 'classes*.dex' > "$dex"
          grep -aFq 'https://staging.diewish.com' "$dex"
          if grep -aFq 'staging.invalid' "$dex"; then
            echo "Unsafe staging.invalid URL found in the compiled APK." >&2
            exit 1
          fi
          echo "VERIFIED_APK_WEB_BASE_URL=https://staging.diewish.com"
      - name: Stamp current-SHA APK
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::7}"
          mkdir -p android/app/build/traceable-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk "android/app/build/traceable-apk/Diewish-hardening-${short_sha}.apk"
          sha256sum "android/app/build/traceable-apk/Diewish-hardening-${short_sha}.apk" > "android/app/build/traceable-apk/Diewish-hardening-${short_sha}.sha256"
          cat "android/app/build/traceable-apk/Diewish-hardening-${short_sha}.sha256"
      - name: Upload current-SHA debug APK
        uses: actions/upload-artifact@v4
        with:
          name: diewish-hardening-debug-apk-${{ github.run_number }}
          path: android/app/build/traceable-apk/
          if-no-files-found: error
          retention-days: 14

  browser-e2e:
    needs: [dependency-audit, backend, frontend]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: diewish
          POSTGRES_PASSWORD: diewish
          POSTGRES_DB: diewish_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U diewish -d diewish_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DIEWISH_ENVIRONMENT: test
      PORT: 4000
      DATABASE_URL: postgresql://diewish:diewish@127.0.0.1:5432/diewish_e2e?schema=public
      JWT_ACCESS_SECRET: browser-e2e-access-secret-012345678901234567890123456789
      JWT_REFRESH_SECRET: browser-e2e-refresh-secret-01234567890123456789012345678
      CORS_ORIGIN: http://127.0.0.1:3000
      APP_WEB_URL: http://127.0.0.1:3000
      LOG_LEVEL: silent
      BCRYPT_ROUNDS: 10
      RATE_LIMIT_MAX: 1000
      AUTH_RATE_LIMIT_MAX: 1000
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:4000/api
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      E2E_WEB_BASE_URL: http://127.0.0.1:3000
      E2E_API_BASE_URL: http://127.0.0.1:4000/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Prepare backend
        working-directory: backend
        run: |
          npm ci
          npx prisma generate
          npx prisma migrate deploy
          npm run build
      - name: Start backend
        working-directory: backend
        run: |
          npm start > /tmp/diewish-backend.log 2>&1 &
          echo $! > /tmp/diewish-backend.pid
      - name: Wait for backend
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4000/api/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/diewish-backend.log
          exit 1
      - name: Prepare frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          # GitHub's Ubuntu image also registers Google's Chrome apt repository.
          # Playwright's --with-deps runs apt-get update even though it installs its
          # own pinned Chromium build. A temporarily inconsistent external Chrome
          # index must not make our application E2E gate flaky, so remove only that
          # unrelated runner repository before asking Playwright for OS libraries.
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f -iname '*google*chrome*' -delete
          npx playwright install --with-deps chromium
          npm run build
      - name: Start frontend
        working-directory: frontend
        run: |
          npm start -- -H 127.0.0.1 -p 3000 > /tmp/diewish-frontend.log 2>&1 &
          echo $! > /tmp/diewish-frontend.pid
      - name: Wait for frontend
        run: |
          for attempt in {1..45}; do
            if curl --fail --silent http://127.0.0.1:3000/register > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/diewish-frontend.log
          exit 1
      - name: Run browser smoke
        working-directory: frontend
        run: >-
          npx playwright test
          e2e/onboarding-flow.spec.js
          e2e/auth-entry-points.spec.js
          e2e/history-data.spec.ts
          e2e/history-share-text.spec.ts
          e2e/history-share-parity.spec.ts
          e2e/history-custom-comparison.spec.ts
          e2e/history-final-recovery.spec.ts
          e2e/history-ui.spec.js
          e2e/admin-foundation.spec.js
          --workers=1 --reporter=line
      - name: Print service logs on failure
        if: failure()
        run: |
          echo "--- backend ---"
          cat /tmp/diewish-backend.log || true
          echo "--- frontend ---"
          cat /tmp/diewish-frontend.log || true
      - name: Stop local services
        if: always()
        run: |
          if [ -f /tmp/diewish-frontend.pid ]; then kill "$(cat /tmp/diewish-frontend.pid)" || true; fi
          if [ -f /tmp/diewish-backend.pid ]; then kill "$(cat /tmp/diewish-backend.pid)" || true; fi
