name: Release Audit Helper

on:
  push:
    branches:
      - work/release-hardening-5

permissions:
  contents: read

jobs:
  backend-audit:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Print backend audit details
        shell: bash
        run: |
          npm audit --json > audit.json || true
          node <<'NODE'
          const fs = require('node:fs');
          const audit = JSON.parse(fs.readFileSync('audit.json', 'utf8'));
          console.log('SUMMARY', JSON.stringify(audit.metadata?.vulnerabilities ?? {}));
          for (const [name, value] of Object.entries(audit.vulnerabilities ?? {})) {
            const via = (value.via ?? []).map((item) => typeof item === 'string'
              ? item
              : { source: item.source, name: item.name, title: item.title, severity: item.severity, range: item.range });
            console.log('VULN', JSON.stringify({
              name,
              severity: value.severity,
              isDirect: value.isDirect,
              via,
              effects: value.effects,
              range: value.range,
              fixAvailable: value.fixAvailable,
            }));
          }
          NODE

  frontend-audit:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Print frontend audit details
        shell: bash
        run: |
          npm audit --json > audit.json || true
          node <<'NODE'
          const fs = require('node:fs');
          const audit = JSON.parse(fs.readFileSync('audit.json', 'utf8'));
          console.log('SUMMARY', JSON.stringify(audit.metadata?.vulnerabilities ?? {}));
          for (const [name, value] of Object.entries(audit.vulnerabilities ?? {})) {
            const via = (value.via ?? []).map((item) => typeof item === 'string'
              ? item
              : { source: item.source, name: item.name, title: item.title, severity: item.severity, range: item.range });
            console.log('VULN', JSON.stringify({
              name,
              severity: value.severity,
              isDirect: value.isDirect,
              via,
              effects: value.effects,
              range: value.range,
              fixAvailable: value.fixAvailable,
            }));
          }
          NODE
