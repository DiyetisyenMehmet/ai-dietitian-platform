name: Unified account password security fix
on:
  push:
    branches: [security/unified-account-password-session-fix-a1]
  pull_request:
    branches: [feature/app10-password-reset-recovery-fix-a1]
    paths:
      - backend/src/modules/account/account.repository.ts
      - backend/src/modules/account/account.service.ts
      - backend/src/modules/account/account.schemas.ts
      - backend/src/integration/account-password-change-security.integration.test.ts
      - .github/workflows/unified-account-password-security-fix.yml
permissions:
  contents: read
jobs:
  password-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: diewish
          POSTGRES_PASSWORD: diewish
          POSTGRES_DB: security_fix
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U diewish -d security_fix" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DIEWISH_ENVIRONMENT: test
      DATABASE_URL: postgresql://diewish:diewish@127.0.0.1:5432/security_fix?schema=public
      JWT_ACCESS_SECRET: security-access-secret-012345678901234567890123456789
      JWT_REFRESH_SECRET: security-refresh-secret-01234567890123456789012345678
      LOG_LEVEL: silent
      BCRYPT_ROUNDS: 10
      RATE_LIMIT_MAX: 1000
      AUTH_RATE_LIMIT_MAX: 1000
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma validate && npx prisma generate && npx prisma migrate deploy
      - name: Type-check affected backend
        run: npm run type-check
      - name: Lint only security change surface
        run: npx eslint src/modules/account/account.repository.ts src/modules/account/account.service.ts src/modules/account/account.schemas.ts src/integration/account-password-change-security.integration.test.ts
      - name: Run only password change security regression
        run: node --import tsx --test --test-concurrency=1 src/integration/account-password-change-security.integration.test.ts
