name: Test 2 Separate Secret Setup
on:
  push:
    branches: [feature/staging-preview]
    paths: [.github/workflows/staging-test2-secret-setup.yml]
permissions:
  contents: read
  id-token: write
concurrency:
  group: staging-test2-secret-setup
  cancel-in-progress: false
jobs:
  prepare-secret:
    if: ${{ github.repository == 'DiyetisyenMehmet/ai-dietitian-platform' && github.ref == 'refs/heads/feature/staging-preview' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: staging
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/730419163638/locations/global/workloadIdentityPools/github-actions/providers/diewish-staging
          service_account: diewish-staging-deployer@project-a2e260c1-839d-4f1d-b90.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: project-a2e260c1-839d-4f1d-b90
      - name: Validate dedicated Neon target and add isolated secret only, without disclosing its value
        shell: bash
        env:
          NEON_TEST2_DATABASE_URL: ${{ secrets.NEON_TEST2_DATABASE_URL }}
        run: |
          set -euo pipefail
          set +x
          export CLOUDSDK_CORE_DISABLE_PROMPTS=1
          PROJECT='project-a2e260c1-839d-4f1d-b90'
          SECRET='diewish-staging-test2-database-url'
          python3 - <<'PY'
          import os,sys,urllib.parse
          s=os.environ.get('NEON_TEST2_DATABASE_URL','')
          try:
              u=urllib.parse.urlsplit(s)
              p=urllib.parse.parse_qs(u.query)
              ok=(u.scheme in ('postgresql','postgres') and
                  u.hostname=='ep-sweet-glitter-bafgdm9p.c-8.eu-central-1.aws.neon.tech' and
                  u.path=='/diewish_staging_test2' and
                  u.username=='diewish_staging_test2_owner' and
                  bool(u.password) and
                  p.get('sslmode',['require'])[0] in ('require','verify-full'))
          except (ValueError,TypeError):
              ok=False
          if not ok:
              print('NO_GO: dedicated Test 2 GitHub secret is missing or has unexpected target',file=sys.stderr)
              sys.exit(2)
          print('PASS: Test 2 URL identity validated, value hidden')
          PY
          if gcloud secrets describe "$SECRET" --project "$PROJECT" --format='value(name)' >/dev/null 2>&1; then
            echo 'BLOCKED: target GCP secret already exists; will not overwrite it'
            exit 3
          fi
          # This is a new, separately named secret. Never modify original staging/Admin secret.
          # Value is streamed through stdin, never printed or passed as CLI argv.
          if printf '%s' "$NEON_TEST2_DATABASE_URL" | gcloud secrets create "$SECRET" \
            --project "$PROJECT" --replication-policy=automatic --data-file=- \
            --labels=environment=staging,purpose=diewish-test2-isolated >/dev/null 2>&1; then
            echo 'PASS: separate Test 2 Secret Manager secret created with one version'
          else
            echo 'BLOCKED: current staging deployer cannot create separate GCP secret; no Admin/live runtime changes'
            exit 4
          fi
          # The workflow deliberately does NOT grant IAM, deploy, tag or switch live traffic.
          echo 'PREPARED_ONLY: Admin and user serving routes unchanged'
