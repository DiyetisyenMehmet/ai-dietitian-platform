name: APP1 Progress A1 Temporary Verification
on:
  push:
    branches:
      - feature/app1-progress-home-reference-a1
permissions:
  contents: read
jobs:
  verify-progress:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Test progress period and data guards
        run: node --test tests/progress-home-reference-a1.test.cjs
      - name: Type check
        run: npm run type-check
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://example.invalid/api
          NEXT_PUBLIC_SITE_URL: https://example.invalid
