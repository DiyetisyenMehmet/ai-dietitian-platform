name: Mirmir motion checks
on:
  push:
    branches: [feature/mascot-mirmir-motion-a2]
    paths:
      - frontend/src/presentation/components/mascot/**
      - frontend/tests/mirmir-motion-browser.test.cjs
permissions:
  contents: read
concurrency:
  group: mirmir-motion-${{ github.ref }}
  cancel-in-progress: true
jobs:
  motion:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: node --test tests/mascot-preferences.test.cjs tests/coach-crossplatform-sync.test.cjs tests/coach-live-sync.test.cjs tests/auth-session-restore.test.cjs
      - run: npx playwright install --with-deps chromium webkit
      - run: node --test tests/mirmir-motion-browser.test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mirmir-motion-visual-evidence
          path: frontend/test-results/mirmir-motion/
          retention-days: 14
      - run: npm run build
