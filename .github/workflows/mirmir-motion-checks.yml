name: Mirmir video checks
on:
  push:
    branches: [feature/mirmir-a4-direct-integration, feature/staging-preview]
    paths:
      - frontend/src/presentation/components/mascot/**
      - frontend/public/images/mascots/mirmir/**
      - frontend/e2e/mirmir-video.spec.ts
      - frontend/playwright.mirmir-video.config.ts
      - .github/workflows/mirmir-motion-checks.yml
permissions:
  contents: read
concurrency:
  group: mirmir-motion-${{ github.ref }}
  cancel-in-progress: true
jobs:
  motion:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: node --test tests/mascot-preferences.test.cjs tests/coach-crossplatform-sync.test.cjs tests/coach-live-sync.test.cjs tests/auth-session-restore.test.cjs
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://example.invalid/api
          NEXT_PUBLIC_SITE_URL: https://example.invalid
      - run: npx playwright test --config playwright.mirmir-video.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mirmir-video-visual-evidence
          path: frontend/test-results/mirmir-video/
          retention-days: 14
