name: Staging Config CI

on:
  push:
    branches:
      - feature/staging-preview
      - fix/production-hardening
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-staging-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate bootstrap shell syntax
        run: |
          bash -n scripts/bootstrap-staging-gcp.sh
          bash -n scripts/bootstrap-staging-auth-gcp.sh
          bash -n scripts/configure-staging-auth.sh

      - name: Assert staging isolation contract
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/staging-preview.yml
          script=scripts/bootstrap-staging-gcp.sh
          auth_bootstrap=scripts/bootstrap-staging-auth-gcp.sh
          auth_runtime=scripts/configure-staging-auth.sh
          android_host=android/app/src/main/java/com/diewish/app/MainActivity.java
          next_config=frontend/next.config.ts
          frontend_build=.github/cloudbuild/frontend-staging.yaml

          grep -q 'BACKEND_SERVICE: diewish-backend-staging' "$workflow"
          grep -q 'FRONTEND_SERVICE: diewish-frontend-staging' "$workflow"
          grep -q 'DATABASE_SECRET_NAME: diewish-staging-database-url' "$workflow"
          grep -q 'DIRECT_DATABASE_SECRET_NAME: diewish-staging-direct-database-url' "$workflow"
          grep -q 'Diewish Staging Neon DATABASE_URL' "$script"

          # WIF trust is pinned to immutable GitHub IDs and the exact staging ref.
          grep -q 'GITHUB_REPOSITORY_ID="1295514788"' "$script"
          grep -q 'GITHUB_REPOSITORY_OWNER_ID="301813832"' "$script"
          grep -q 'STAGING_REF="refs/heads/feature/staging-preview"' "$script"
          grep -Fq "assertion.repository_id=='\${GITHUB_REPOSITORY_ID}'" "$script"
          grep -Fq "assertion.repository_owner_id=='\${GITHUB_REPOSITORY_OWNER_ID}'" "$script"
          grep -Fq "assertion.ref=='\${STAGING_REF}'" "$script"
          grep -q 'attribute.repository_id=assertion.repository_id' "$script"
          grep -q 'attribute.repository_owner_id=assertion.repository_owner_id' "$script"
          grep -Fq 'attribute.repository_id/${GITHUB_REPOSITORY_ID}' "$script"

          if grep -Fq "assertion.repository=='\${GITHUB_REPOSITORY}'" "$script"; then
            echo 'WIF trust must not rely on the mutable GitHub repository name.' >&2
            exit 1
          fi

          # Cloud Run assigns separate service hosts. Browser/API auth must still
          # be first-party: browser requests /api on the frontend origin, Next.js
          # proxies server-side to the isolated backend, and the HttpOnly refresh
          # cookie keeps the stricter Lax policy.
          grep -Fq '_API_BASE_URL=/api' "$workflow"
          grep -Fq '_API_PROXY_TARGET=${BACKEND_URL}' "$workflow"
          grep -q 'REFRESH_COOKIE_SAME_SITE=lax' "$workflow"
          grep -q 'DIEWISH_API_PROXY_TARGET' "$next_config"
          grep -q 'source: "/api/:path\*"' "$next_config"
          grep -q 'build-arg=DIEWISH_API_PROXY_TARGET=' "$frontend_build"
          grep -q 'setAcceptThirdPartyCookies(webView, false)' "$android_host"

          # Authentication bootstrap is intentionally separate from the original
          # staging bootstrap so adding Firebase never rotates DB/JWT secrets.
          grep -q 'firebase.googleapis.com' "$auth_bootstrap"
          grep -q 'identitytoolkit.googleapis.com' "$auth_bootstrap"
          grep -q 'securetoken.googleapis.com' "$auth_bootstrap"
          grep -q 'apikeys.googleapis.com' "$auth_bootstrap"
          grep -q 'roles/firebaseauth.editor' "$auth_bootstrap"
          grep -q 'roles/serviceusage.apiKeysViewer' "$auth_bootstrap"
          grep -q 'firebase-tools@${FIREBASE_TOOLS_VERSION}' "$auth_bootstrap"
          grep -q '"anonymous": false' "$auth_bootstrap"
          grep -q '"emailPassword": true' "$auth_bootstrap"
          grep -q '"googleSignIn"' "$auth_bootstrap"
          grep -Fq 'signIn:{phoneNumber:{enabled:true},anonymous:{enabled:false}}' "$auth_bootstrap"
          grep -Fq 'smsRegionConfig:{allowlistOnly:{allowedRegions:$regions}}' "$auth_bootstrap"

          if grep -Eq 'diewish-staging-(database-url|direct-database-url|jwt-access|jwt-refresh)|JWT_ACCESS_SECRET|JWT_REFRESH_SECRET' "$auth_bootstrap"; then
            echo 'Auth bootstrap must never touch staging database/JWT secrets.' >&2
            exit 1
          fi
          if grep -Eq 'roles/(owner|editor|firebase\.admin|serviceusage\.serviceUsageAdmin)' "$auth_bootstrap"; then
            echo 'Auth bootstrap must not grant broad project-admin roles to the staging deployer.' >&2
            exit 1
          fi

          # Every real staging deployment must fail closed unless Google/phone
          # provider state and the public Firebase Web App config are valid.
          grep -q 'bash scripts/configure-staging-auth.sh' "$workflow"
          grep -q 'FIREBASE_WEB_API_KEY=${FIREBASE_WEB_API_KEY}' "$workflow"
          grep -q 'FIREBASE_AUTH_DOMAIN=${FIREBASE_AUTH_DOMAIN}' "$workflow"
          grep -q 'FIREBASE_WEB_APP_ID=${FIREBASE_WEB_APP_ID}' "$workflow"
          grep -q '/api/identity/firebase-config' "$workflow"
          grep -q '.configured == true' "$workflow"
          grep -q 'Google ile devam et' "$workflow"
          grep -q 'Telefon numarası ile devam et' "$workflow"
          grep -q 'Misafir olarak devam et' "$workflow"
          grep -q 'Hesabı yeniden etkinleştir' "$workflow"

          grep -q 'identitytoolkit.googleapis.com' "$auth_runtime"
          grep -q 'firebase.googleapis.com' "$auth_runtime"
          grep -q 'signIn.phoneNumber.enabled' "$auth_runtime"
          grep -q 'signIn.anonymous.enabled' "$auth_runtime"
          grep -q 'smsRegionConfig' "$auth_runtime"
          grep -q 'defaultSupportedIdpConfigs/google.com' "$auth_runtime"
          grep -q 'FIREBASE_WEB_API_KEY=' "$auth_runtime"
          grep -q 'FIREBASE_AUTH_DOMAIN=' "$auth_runtime"
          grep -q 'FIREBASE_WEB_APP_ID=' "$auth_runtime"

          if grep -q 'setAcceptThirdPartyCookies(webView, true)' "$android_host"; then
            echo 'Android WebView must not globally accept third-party cookies.' >&2
            exit 1
          fi

          if grep -q 'REFRESH_COOKIE_SAME_SITE=none' "$workflow"; then
            echo 'Staging refresh cookie unexpectedly weakened to SameSite=None.' >&2
            exit 1
          fi

          if grep -Eq 'BACKEND_SERVICE: diewish-backend$|FRONTEND_SERVICE: diewish-frontend$' "$workflow"; then
            echo 'Production service name detected in staging deployment workflow.' >&2
            exit 1
          fi

          if grep -q 'wild-dawn-63542383' "$workflow" "$script" "$auth_bootstrap" "$auth_runtime"; then
            echo 'Production Neon project reference detected in staging deployment config.' >&2
            exit 1
          fi
