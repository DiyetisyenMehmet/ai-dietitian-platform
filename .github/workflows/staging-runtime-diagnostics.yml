name: Staging Runtime Diagnostics

on:
  workflow_dispatch:
  push:
    branches:
      - feature/staging-preview
    paths:
      - .github/workflows/staging-runtime-diagnostics.yml

permissions:
  contents: read

env:
  STAGING_FRONTEND_URL: https://diewish-frontend-staging-730419163638.europe-west1.run.app

jobs:
  runtime-diagnostics:
    name: Diagnose blood-test PDF staging path
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    steps:
      - uses: actions/checkout@v4

      # Exercises the public same-origin staging route with a generated synthetic
      # laboratory PDF. On failure the script prints only the API's safe error
      # envelope and safe analysis metadata; it never prints document bytes,
      # extracted lab text, biomarker values, or provider payloads.
      - name: Run synthetic blood-test PDF diagnostic
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/staging-blood-pdf-e2e.sh "$STAGING_FRONTEND_URL"
