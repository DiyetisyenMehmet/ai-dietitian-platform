name: Isolated Neon Test 2 acceptance
run-name: Test 2 manual request by ${{ github.actor }}

# No push, schedule, PR synchronize or privileged pull_request_target trigger.
# A label applied manually by the repository owner is the branch-only entry
# point while workflow_dispatch cannot be registered without changing main.
on:
  pull_request:
    branches: [feature/staging-preview]
    types: [labeled]
  workflow_dispatch:
    inputs:
      mode:
        description: "Explicit isolated Test 2 operation"
        type: choice
        options: [network, acceptance]
        default: network
        required: true
      confirm_test2:
        description: "Confirm only Test 2; acceptance may apply migrations and create synthetic rows"
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: isolated-neon-test2-acceptance
  cancel-in-progress: false

jobs:
  network:
    if: >-
      ${{ github.repository == 'DiyetisyenMehmet/ai-dietitian-platform'
          && github.actor == 'DiyetisyenMehmet'
          && ((github.event_name == 'pull_request'
               && github.event.pull_request.number == 89
               && github.event.pull_request.head.repo.full_name == github.repository
               && github.event.pull_request.head.ref == 'feature/app10-test2-e2e-connection-a1'
               && (github.event.label.name == 'test2-network-check'
                   || github.event.label.name == 'test2-acceptance'))
              || (github.event_name == 'workflow_dispatch'
                  && github.ref == 'refs/heads/feature/app10-test2-e2e-connection-a1'
                  && inputs.confirm_test2)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check exact Test 2 DNS, TCP and certificate-verified PostgreSQL TLS
        shell: bash
        run: |
          python3 - <<'PY'
          import json, socket, ssl, struct, sys
          host = 'ep-sweet-glitter-bafgdm9p.c-8.eu-central-1.aws.neon.tech'
          stage = 'DNS'
          try:
              socket.getaddrinfo(host, 5432, type=socket.SOCK_STREAM)
              print('PASS: exact Test 2 DNS')
              stage = 'TCP'
              with socket.create_connection((host, 5432), timeout=15) as connection:
                  print('PASS: exact Test 2 PostgreSQL TCP')
                  stage = 'PostgreSQL TLS'
                  connection.sendall(struct.pack('!II', 8, 80877103))
                  if connection.recv(1) != b'S':
                      raise RuntimeError('PostgreSQL TLS unavailable')
                  with ssl.create_default_context().wrap_socket(connection, server_hostname=host):
                      print('PASS: certificate-verified PostgreSQL TLS')
              print(json.dumps({'result': 'PASS', 'database_authentication': 'NOT_ATTEMPTED'}))
          except Exception as error:
              print(json.dumps({'result': 'BLOCKED', 'stage': stage, 'error_type': type(error).__name__}))
              sys.exit(1)
          PY

  acceptance:
    needs: network
    if: >-
      ${{ needs.network.result == 'success'
          && ((github.event_name == 'pull_request' && github.event.label.name == 'test2-acceptance')
              || (github.event_name == 'workflow_dispatch'
                  && inputs.confirm_test2 && inputs.mode == 'acceptance')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CHECKPOINT_DISABLE: "1"
      DO_NOT_TRACK: "1"
      SCARF_ANALYTICS: "false"
      PRISMA_HIDE_UPDATE_MESSAGE: "1"
    steps:
      # Always run the already inspected source, never arbitrary PR/merge code.
      - uses: actions/checkout@v4
        with:
          ref: c91845a1801367393ab6d58fa9eec8b3f35aff9d
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install without third-party lifecycle scripts
        working-directory: backend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Generate existing Prisma client and verify target guards
        working-directory: backend
        run: |
          node node_modules/prisma/build/index.js generate
          node --test scripts/test2-target.test.mjs
      - name: Write only the dedicated Test 2 secret to a private ephemeral file
        env:
          TEST2_CONNECTION: ${{ secrets.NEON_TEST2_DATABASE_URL }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, pathlib, sys
          from urllib.parse import urlsplit, parse_qs
          value = os.environ.get('TEST2_CONNECTION', '')
          if not value:
              print('BLOCKED: dedicated NEON_TEST2_DATABASE_URL is not configured')
              sys.exit(1)
          try:
              url = urlsplit(value)
              valid = (url.scheme in ('postgres', 'postgresql')
                       and url.hostname == 'ep-sweet-glitter-bafgdm9p.c-8.eu-central-1.aws.neon.tech'
                       and url.path == '/diewish_staging_test2'
                       and url.username == 'diewish_staging_test2_owner'
                       and bool(url.password)
                       and parse_qs(url.query).get('sslmode') in (['require'], ['verify-full']))
          except Exception:
              valid = False
          if not valid:
              print('BLOCKED: dedicated secret does not match the exact Test 2 target')
              sys.exit(1)
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'neon-test2-connection.json'
          descriptor = os.open(target, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(descriptor, 'w') as output:
              json.dump({'DATABASE_URL': value}, output)
          print('PASS: private Test 2 credential file prepared; value not printed')
          PY
      - name: Apply existing migrations and run actual backend acceptance
        working-directory: backend
        run: >-
          node --import tsx scripts/test2-acceptance.mjs
          --connection-file "${RUNNER_TEMP}/neon-test2-connection.json" --migrate
      - name: Remove this job's ephemeral credential file
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import os, pathlib
          (pathlib.Path(os.environ['RUNNER_TEMP']) / 'neon-test2-connection.json').unlink(missing_ok=True)
          PY
