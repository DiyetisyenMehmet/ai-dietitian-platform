name: Staging Notification Test APK

on:
  push:
    branches:
      - feature/staging-preview
    paths:
      - ".github/workflows/staging-notification-test-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Build staging notification test APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Test notification routes and build staging-bound APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon -p android :app:testDebugUnitTest :app:assembleDebug \
            -PDIEWISH_WEB_BASE_URL="https://staging.diewish.com"

          short_sha="${GITHUB_SHA::7}"
          mkdir -p android/app/build/staging-notification-test
          apk="android/app/build/staging-notification-test/Diewish-staging-notification-test-${short_sha}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$apk"
          sha256sum "$apk" > "${apk}.sha256"
          cat > android/app/build/staging-notification-test/README.txt <<EOF
          Diewish staging notification test APK
          commit=${GITHUB_SHA}
          frontend=https://staging.diewish.com
          environment=staging
          android_fcm=disabled_until_firebase_android_app_is_registered
          EOF

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: diewish-staging-notification-test-apk-${{ github.run_number }}
          path: android/app/build/staging-notification-test/
          if-no-files-found: error
          retention-days: 14
