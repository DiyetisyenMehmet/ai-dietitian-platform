name: Bootstrap Staging Firebase Android App

on:
  push:
    branches:
      - feature/staging-preview
    paths:
      - ".github/workflows/staging-firebase-android-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: diewish-staging-firebase-android-bootstrap
  cancel-in-progress: false

env:
  PROJECT_ID: project-a2e260c1-839d-4f1d-b90
  PROJECT_NUMBER: "730419163638"
  WIF_PROVIDER: projects/730419163638/locations/global/workloadIdentityPools/github-actions/providers/diewish-staging
  DEPLOY_SERVICE_ACCOUNT: diewish-staging-deployer@project-a2e260c1-839d-4f1d-b90.iam.gserviceaccount.com
  ANDROID_PACKAGE: com.diewish.app

jobs:
  bootstrap:
    name: Ensure isolated staging Android app
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Validate staging identity
        shell: bash
        run: |
          set -euo pipefail
          test "$PROJECT_ID" = "project-a2e260c1-839d-4f1d-b90"
          test "$PROJECT_NUMBER" = "730419163638"
          [[ "$WIF_PROVIDER" == *"diewish-staging"* ]]
          [[ "$DEPLOY_SERVICE_ACCOUNT" == diewish-staging-deployer@* ]]
          test "$ANDROID_PACKAGE" = "com.diewish.app"

      - name: Authenticate to isolated staging project
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Ensure staging Firebase Android app exists
        shell: bash
        run: |
          set -euo pipefail
          auth_header="Authorization: Bearer $(gcloud auth print-access-token)"

          list_apps() {
            local output="$1"
            local status
            status="$(curl --silent --show-error -o "$output" -w '%{http_code}' \
              -H "$auth_header" \
              -H "x-goog-user-project: ${PROJECT_ID}" \
              "https://firebase.googleapis.com/v1beta1/projects/${PROJECT_ID}/androidApps")"
            if [[ "$status" != "200" ]]; then
              echo "Could not read isolated staging Firebase Android apps (HTTP ${status})." >&2
              exit 1
            fi
          }

          apps_file="$(mktemp)"
          list_apps "$apps_file"
          existing="$(jq -r --arg package "$ANDROID_PACKAGE" '(.apps // [])[] | select(.packageName == $package) | .name' "$apps_file" | head -n 1)"
          rm -f "$apps_file"

          if [[ -n "$existing" ]]; then
            echo "Staging Firebase Android app already exists."
            exit 0
          fi

          request_file="$(mktemp)"
          create_body="$(jq -cn --arg package "$ANDROID_PACKAGE" '{displayName:"Diewish Staging Android",packageName:$package}')"
          create_code="$(curl --silent --show-error -o "$request_file" -w '%{http_code}' \
            -X POST \
            -H "$auth_header" \
            -H "x-goog-user-project: ${PROJECT_ID}" \
            -H 'Content-Type: application/json' \
            -d "$create_body" \
            "https://firebase.googleapis.com/v1beta1/projects/${PROJECT_ID}/androidApps")"

          if [[ "$create_code" != "200" && "$create_code" != "201" && "$create_code" != "202" ]]; then
            error_status="$(jq -r '.error.status // "unknown"' "$request_file" 2>/dev/null || true)"
            echo "Could not create isolated staging Firebase Android app (HTTP ${create_code}, status=${error_status})." >&2
            rm -f "$request_file"
            exit 1
          fi

          operation_name="$(jq -r '.name // empty' "$request_file")"
          rm -f "$request_file"
          if [[ -n "$operation_name" ]]; then
            for attempt in {1..30}; do
              operation_file="$(mktemp)"
              operation_code="$(curl --silent --show-error -o "$operation_file" -w '%{http_code}' \
                -H "$auth_header" \
                -H "x-goog-user-project: ${PROJECT_ID}" \
                "https://firebase.googleapis.com/v1beta1/${operation_name}")"
              if [[ "$operation_code" != "200" ]]; then
                rm -f "$operation_file"
                echo "Could not read Firebase Android app creation operation (HTTP ${operation_code})." >&2
                exit 1
              fi
              if jq -e '.error' "$operation_file" >/dev/null 2>&1; then
                operation_status="$(jq -r '.error.status // "unknown"' "$operation_file")"
                rm -f "$operation_file"
                echo "Staging Firebase Android app creation failed (status=${operation_status})." >&2
                exit 1
              fi
              if jq -e '.done == true' "$operation_file" >/dev/null 2>&1; then
                response_package="$(jq -r '.response.packageName // empty' "$operation_file")"
                response_project="$(jq -r '.response.projectId // empty' "$operation_file")"
                rm -f "$operation_file"
                if [[ -n "$response_package" && "$response_package" != "$ANDROID_PACKAGE" ]]; then
                  echo "Staging Firebase Android app creation returned an unexpected package." >&2
                  exit 1
                fi
                if [[ -n "$response_project" && "$response_project" != "$PROJECT_ID" ]]; then
                  echo "Staging Firebase Android app creation returned an unexpected project." >&2
                  exit 1
                fi
                break
              fi
              rm -f "$operation_file"
              if [[ "$attempt" == "30" ]]; then
                echo "Staging Firebase Android app creation did not finish in the bounded poll window." >&2
                exit 1
              fi
              sleep 2
            done
          fi

          for attempt in {1..15}; do
            apps_file="$(mktemp)"
            list_apps "$apps_file"
            created="$(jq -r --arg package "$ANDROID_PACKAGE" '(.apps // [])[] | select(.packageName == $package) | .name' "$apps_file" | head -n 1)"
            rm -f "$apps_file"
            if [[ -n "$created" ]]; then
              echo "Staging Firebase Android app registration verified."
              exit 0
            fi
            sleep 2
          done

          echo "Staging Firebase Android app was not visible after creation." >&2
          exit 1
