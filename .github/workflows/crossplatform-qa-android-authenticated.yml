name: Cross-platform QA Authenticated Android
# Wait for the fresh guest's validated internet before the first native launch.
# Wait for ActivityManager/process readiness again after a genuine force-stop.
# Verify the native startup Dashboard before navigating away from auth recovery.

on:
  push:
    branches: [feature/workmode4-crossplatform-qa-infra-a1]
    paths: [".github/workflows/crossplatform-qa-android-authenticated.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authenticated-android:
    if: github.ref == 'refs/heads/feature/workmode4-crossplatform-qa-infra-a1'
    uses: ./.github/workflows/crossplatform-qa-infra.yml
    with:
      authenticated: true
      platform: android
    secrets: inherit
