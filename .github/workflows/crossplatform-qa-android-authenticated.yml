name: Cross-platform QA Authenticated Android
# Wait for the fresh guest's validated internet before the first native launch.
# Wait for ActivityManager/process readiness again after a genuine force-stop.
# Verify the native startup Dashboard before navigating away from auth recovery.
# Export guarded empty-login failure evidence if the real session cannot restore.
# Android WebView does not support the browser cookie-enumeration protocol.
# Retest APP5 native session persistence with the unchanged QA harness.

on:
  push:
    branches: [feature/workmode4-crossplatform-qa-infra-a1]
    paths: [".github/workflows/crossplatform-qa-android-authenticated.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authenticated-android:
    if: github.ref == 'refs/heads/feature/workmode4-crossplatform-qa-infra-a1'
    uses: ./.github/workflows/crossplatform-qa-infra.yml
    with:
      authenticated: true
      platform: android
      android_source_ref: d69502cd9c238c7e4958c6a21386de877b4c37d8
      android_operation: sync-web-to-android
    secrets: inherit

# Expose only fixed sync phases to locate the first runtime timeout; behavior and capture rules stay unchanged.

# Separate target navigation from list opening; emit only fixed UI-control visibility flags.

# Wait for the mounted coach history control before opening the target list.
