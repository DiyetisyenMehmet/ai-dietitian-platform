name: Email login response contract A5
on:
  pull_request:
    branches: [feature/staging-preview]
    paths:
      - frontend/tests/email-login-response-contract.test.cjs
      - .github/workflows/email-login-response-contract.yml
permissions:
  contents: read
jobs:
  login-response-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Only email-login endpoint, payload and response classification
        run: node --test tests/email-login-response-contract.test.cjs
