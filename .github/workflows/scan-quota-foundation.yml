name: Scan quota foundation checks
on:
  push:
    branches: [feature/app8-subscription-free-premium-faz2a-quota-foundation]
    paths:
      - .github/workflows/scan-quota-foundation.yml
      - backend/prisma/**
      - backend/src/config/env.ts
      - backend/src/modules/ai-usage/**
      - backend/src/modules/payments/**
      - backend/src/integration/scan-quota-foundation.integration.test.ts
      - backend/package*.json
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: scan-quota-${{ github.ref }}
  cancel-in-progress: true
jobs:
  isolated-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: diewish
          POSTGRES_PASSWORD: isolated-test-only
          POSTGRES_DB: diewish_scan_quota_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U diewish -d diewish_scan_quota_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DIEWISH_ENVIRONMENT: test
      DATABASE_URL: postgresql://diewish:isolated-test-only@127.0.0.1:5432/diewish_scan_quota_test?schema=public
      JWT_ACCESS_SECRET: quota-test-access-secret-01234567890123456789
      JWT_REFRESH_SECRET: quota-test-refresh-secret-0123456789012345678
      LOG_LEVEL: silent
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Prepare disposable loopback database only
        run: |
          node -e 'const u = new URL(process.env.DATABASE_URL); if (u.hostname !== "127.0.0.1" || u.pathname !== "/diewish_scan_quota_test" || process.env.DIEWISH_ENVIRONMENT !== "test") process.exit(1)'
          npm ci --no-audit --no-fund
          npx prisma validate
          npx prisma generate
          npx prisma migrate deploy
      - name: Type and targeted lint checks
        run: |
          npm run type-check
          npx eslint src/config/env.ts src/modules/ai-usage/scan-quota*.ts src/modules/ai-usage/ai-usage.service.ts src/modules/ai-usage/ai-usage.controller.ts src/modules/ai-usage/constants.ts src/modules/ai-usage/types/index.ts src/modules/payments/subscription-state.ts src/modules/payments/payments.repository.ts src/modules/payments/google-play-entitlements.repository.ts src/integration/scan-quota-foundation.integration.test.ts --max-warnings 0
      - name: OFF and policy regression checks
        run: node --import tsx --test src/modules/ai-usage/scan-quota-policy.test.ts
      - name: Atomic persistence and independent-client race evidence
        run: |
          set -o pipefail
          node --import tsx --test --test-concurrency=1 src/integration/scan-quota-foundation.integration.test.ts | tee /tmp/scan-quota-foundation-evidence.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scan-quota-foundation-evidence
          path: /tmp/scan-quota-foundation-evidence.log
