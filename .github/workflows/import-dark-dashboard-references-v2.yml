name: Import final dark dashboard references v3

on:
  push:
    branches:
      - feature/staging-preview

permissions:
  contents: write

jobs:
  import-dark-references:
    if: github.event.head_commit.message == 'run-dark-reference-import-final'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: feature/staging-preview
          fetch-depth: 0

      - name: Download exact user references
        shell: bash
        env:
          FOOD_URL: 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/9dafb286-6da5-4a2a-b6f0-61285925d4e7?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMTkyYmRkZTA3ZDY2ODY5NyIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc4OTg0NDQ0OH0.tWebKJKe3vPf07o4CWb5Rr3hE7OkRWcCAWs5w8t_2pY'
          BLOOD_URL: 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/d5b268b1-a61a-4995-bad1-5218543d0757?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZjIyOTNjMzk4OTQ0ZmMzMCIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc4OTg2Mzg2NX0.ULGAaUL64_U1n6n6CDK1gkPDCpTzMh50k7s41fJCDsU'
          PROGRESS_URL: 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/f344a63f-8473-411e-b0ff-c1e500101e36?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZjg1MmI0ZmU0YjI2MGU3MiIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc4OTgyNDI1NH0.6oE7osbPZ2wfoPxSc2wXaffHc63pYuamacXOoRpNngg'
        run: |
          set -euo pipefail
          mkdir -p /tmp/diewish-dark-refs
          curl --fail --location --silent --show-error "$FOOD_URL" -o /tmp/diewish-dark-refs/food.png
          curl --fail --location --silent --show-error "$BLOOD_URL" -o /tmp/diewish-dark-refs/blood.png
          curl --fail --location --silent --show-error "$PROGRESS_URL" -o /tmp/diewish-dark-refs/progress.png
          echo 'f32f69dbb8fcb516d9b6c11152a91e56ef1fce19a454d27368ac58596de85e1f  /tmp/diewish-dark-refs/food.png' | sha256sum -c -
          echo 'ac94fce855fc1635dc634da97516cfd5f799b65b003cf3a36704a78123bdeb73  /tmp/diewish-dark-refs/blood.png' | sha256sum -c -
          echo '79dc91d623b0751ff577ec0ed06da61358015e9dcd9cd1a4e22e3900adc04e31  /tmp/diewish-dark-refs/progress.png' | sha256sum -c -

      - name: Extract card surfaces losslessly
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check pillow
          python <<'PY'
          from pathlib import Path
          from PIL import Image

          src = Path('/tmp/diewish-dark-refs')
          out = Path('frontend/public/images/dashboard/references')
          out.mkdir(parents=True, exist_ok=True)

          specs = {
              'food': ((33, 240, 1502, 594), 'food-dark-final.png'),
              'blood': ((37, 205, 1499, 615), 'blood-dark-final.png'),
              'progress': ((42, 248, 1494, 602), 'progress-dark-final.png'),
          }

          for name, (box, filename) in specs.items():
              image = Image.open(src / f'{name}.png')
              card = image.crop(box)
              card.save(out / filename, format='PNG', optimize=False)
              print(filename, card.mode, card.size)
          PY
          echo '9ae96a52d51a057bdf238e2ea379a948752289f3e1745de06b45a05e44f67095  frontend/public/images/dashboard/references/food-dark-final.png' | sha256sum -c -
          echo 'e317d48d6a8fb50715d09429c8ed30533ad736d9a8d72ebe4ca61ae9ec63ff29  frontend/public/images/dashboard/references/blood-dark-final.png' | sha256sum -c -
          echo '103cef9a36e77ca400e614571ea718813ff06ddcd5d4cb7d8978affe8c64116e  frontend/public/images/dashboard/references/progress-dark-final.png' | sha256sum -c -

      - name: Commit exact dark references
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Diewish Staging Automation"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/public/images/dashboard/references/*-dark-final.png
          if git diff --cached --quiet; then
            echo "Dark references already match expected hashes."
            exit 0
          fi
          git commit -m "chore(dashboard): add exact dark reference assets"
          git push origin HEAD:feature/staging-preview
