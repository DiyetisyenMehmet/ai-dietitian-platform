name: Blood Test Base Asset Bootstrap

on:
  push:
    branches:
      - feature/staging-preview
    paths:
      - .github/workflows/blood-test-base-asset-bootstrap.yml

permissions:
  contents: write

concurrency:
  group: blood-test-base-asset-bootstrap
  cancel-in-progress: false

jobs:
  add-approved-base-assets:
    if: contains(github.event.head_commit.message, '[blood-base-bootstrap]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/staging-preview
          fetch-depth: 1
      - name: Download exact approved text-free base visuals
        shell: bash
        env:
          LIGHT_URL: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/c58ce996-5d10-4e6b-a3ce-dad4b52dc7c5.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYWNiYmQxMzFlNzFkODkwMyIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDc3MzkzN30.EJLPRzyTncrq90uMfTLBQUUVC7AFhPPUOVbcQGNjmsU"
          DARK_URL: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/4d092fda-7e74-4fac-8c74-f9404b406491.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZjZkZmFhYTU1MmNiMjlhZCIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDczNjU0OX0.LveYqCngv92uOAR2mgMkr9dij0iCEXLVpexOakaGOJk"
        run: |
          set -euo pipefail
          mkdir -p frontend/public/images/dashboard
          curl --fail --location --silent --show-error "$LIGHT_URL" -o frontend/public/images/dashboard/blood-test-card-base-light.png
          curl --fail --location --silent --show-error "$DARK_URL" -o frontend/public/images/dashboard/blood-test-card-base-dark.png
          printf '%s  %s\n'             '65000aa276148b7e667f4c6a27af571ddcef62884cd3b0ff21d5d115b5cd2d98'             'frontend/public/images/dashboard/blood-test-card-base-light.png'             '185966c714c0194a080cca81d0bcdcd5e1c9a1819b34c01da2f8a1b43387057d'             'frontend/public/images/dashboard/blood-test-card-base-dark.png' | sha256sum --check --strict
      - name: Commit exact assets to staging branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/images/dashboard/blood-test-card-base-light.png
          git add frontend/public/images/dashboard/blood-test-card-base-dark.png
          git diff --cached --check
          git commit -m "chore(dashboard): add approved blood test base visuals"
          git push origin HEAD:feature/staging-preview
