name: Meal check-in isolated PostgreSQL
on:
  push:
    branches: [fix/app13-g1-meal-checkin-phase2]
  pull_request:
    branches: [feature/staging-preview]
    paths:
      - 'backend/src/modules/tracking/meal-check-in*'
      - 'backend/src/modules/tracking/meal-checkin-contract.test.ts'
      - 'backend/src/modules/tracking/tracking.routes.ts'
      - 'backend/prisma/**'
      - '.github/workflows/meal-check-in-postgres.yml'
permissions:
  contents: read
concurrency:
  group: meal-check-in-${{ github.ref }}
  cancel-in-progress: true
jobs:
  postgres-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app13
          POSTGRES_PASSWORD: synthetic-local-only
          POSTGRES_DB: app13_mealcheckin_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app13 -d app13_mealcheckin_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DIEWISH_ENVIRONMENT: test
      DATABASE_URL: postgresql://app13:synthetic-local-only@127.0.0.1:5432/app13_mealcheckin_test
      MEAL_CHECK_IN_TEST_DATABASE_URL: postgresql://app13:synthetic-local-only@127.0.0.1:5432/app13_mealcheckin_test
      MEAL_CHECK_IN_LOCAL_TEST: '1'
      JWT_ACCESS_SECRET: synthetic-local-only-access-secret-0123456789
      JWT_REFRESH_SECRET: synthetic-local-only-refresh-secret-0123456789
      LOG_LEVEL: silent
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma generate
      # Only this ephemeral service DB. Draft is applied by guarded tests,
      # never moved into the automatic shared deployment migration chain.
      - run: npx prisma migrate deploy
      - run: npx tsc --noEmit
      - run: npx eslint src/modules/tracking/meal-check-in*.ts src/modules/tracking/meal-checkin-contract.test.ts src/modules/tracking/tracking.routes.ts --max-warnings 0
      - name: Existing meal compatibility and security checks
        run: node --import tsx --test src/modules/tracking/meal-checkin-contract.test.ts src/modules/tracking/meal-consumed-amount.test.ts src/middleware/zod-security.test.ts
      - name: Real PostgreSQL acceptance with two backend processes
        run: node --import tsx --test src/modules/tracking/meal-check-in.postgres.test.ts
      - run: npm run build
