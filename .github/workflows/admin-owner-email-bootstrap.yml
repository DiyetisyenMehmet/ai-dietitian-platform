name: Admin Owner Email Bootstrap

on:
  push:
    branches:
      - feature/staging-preview

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: project-a2e260c1-839d-4f1d-b90
  WIF_PROVIDER: projects/730419163638/locations/global/workloadIdentityPools/github-actions/providers/diewish-staging
  DEPLOY_SERVICE_ACCOUNT: diewish-staging-deployer@project-a2e260c1-839d-4f1d-b90.iam.gserviceaccount.com
  ADMIN_STAGING_URL: https://admin-staging.diewish.com
  ADMIN_OWNER_EMAIL: admindiewish@gmail.com
  ADMIN_EMAIL_SHA256: ed911dcbf3353a718ab0e6e3039e92287169025cb0a4609de03ade42a6463cb8

jobs:
  bootstrap-owner:
    if: ${{ contains(github.event.head_commit.message, '[admin-owner-email-bootstrap]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Trigger approved owner setup email
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "feature/staging-preview"
          test "${ADMIN_STAGING_URL}" = "https://admin-staging.diewish.com"
          HTTP_CODE="$(curl --silent --show-error \
            --output /tmp/admin-owner-bootstrap.json \
            --write-out '%{http_code}' \
            --request POST \
            --header 'content-type: application/json' \
            --data "{\"email\":\"${ADMIN_OWNER_EMAIL}\"}" \
            "${ADMIN_STAGING_URL}/api/admin/auth/bootstrap")"
          test "${HTTP_CODE}" = "200"
          jq -e '.success == true' /tmp/admin-owner-bootstrap.json >/dev/null
          echo "Approved owner setup request accepted by staging."

      - name: Authenticate to isolated staging Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Verify staging Super Admin RBAC and audit
        shell: bash
        run: |
          set -euo pipefail
          BUILD_ID="$(gcloud builds submit \
            --async \
            --no-source \
            --project "${PROJECT_ID}" \
            --config .github/cloudbuild/admin-first-super-admin-staging.yaml \
            --substitutions "_GIT_SHA=${GITHUB_SHA},_ADMIN_EMAIL_SHA256=${ADMIN_EMAIL_SHA256}" \
            --format='value(id)' \
            --quiet)"
          test -n "${BUILD_ID}"
          for attempt in $(seq 1 120); do
            STATUS="$(gcloud builds describe "${BUILD_ID}" --project "${PROJECT_ID}" --format='value(status)')"
            case "${STATUS}" in
              SUCCESS)
                echo "Owner staging RBAC/audit verification: SUCCESS"
                exit 0
                ;;
              FAILURE|CANCELLED|TIMEOUT|EXPIRED)
                echo "Owner staging RBAC/audit verification: ${STATUS}"
                gcloud builds describe "${BUILD_ID}" \
                  --project "${PROJECT_ID}" \
                  --format='yaml(status,statusDetail,failureInfo,steps.id,steps.status)' || true
                exit 1
                ;;
            esac
            sleep 5
          done
          echo "Timed out waiting for owner verification."
          exit 1
