name: Staging Firebase Permission Probe

on:
  push:
    branches:
      - feature/staging-preview
    paths:
      - ".github/workflows/staging-firebase-permission-probe.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: project-a2e260c1-839d-4f1d-b90
  WIF_PROVIDER: projects/730419163638/locations/global/workloadIdentityPools/github-actions/providers/diewish-staging
  DEPLOY_SERVICE_ACCOUNT: diewish-staging-deployer@project-a2e260c1-839d-4f1d-b90.iam.gserviceaccount.com

jobs:
  probe:
    name: Probe staging Firebase/IAM permissions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Validate staging identity
        shell: bash
        run: |
          set -euo pipefail
          test "$PROJECT_ID" = "project-a2e260c1-839d-4f1d-b90"
          [[ "$WIF_PROVIDER" == *"diewish-staging"* ]]
          [[ "$DEPLOY_SERVICE_ACCOUNT" == diewish-staging-deployer@* ]]

      - name: Authenticate to staging
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Test exact permissions
        shell: bash
        run: |
          set -euo pipefail
          token="$(gcloud auth print-access-token)"
          body='{"permissions":["firebase.clients.create","firebase.clients.get","firebase.clients.list","resourcemanager.projects.getIamPolicy","resourcemanager.projects.setIamPolicy","iam.roles.create","iam.roles.update","iam.roles.get"]}'
          response="$(curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${token}" \
            -H "x-goog-user-project: ${PROJECT_ID}" \
            -H "Content-Type: application/json" \
            -d "$body" \
            "https://cloudresourcemanager.googleapis.com/v1/projects/${PROJECT_ID}:testIamPermissions")"
          echo "Granted staging permissions:"
          jq -r '.permissions[]?' <<<"$response" | sort
