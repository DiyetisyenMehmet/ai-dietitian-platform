name: Staging Preview Deploy

on:
  push:
    branches:
      - feature/staging-preview
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: diewish-staging-preview
  cancel-in-progress: false

env:
  PROJECT_ID: project-a2e260c1-839d-4f1d-b90
  PROJECT_NUMBER: "730419163638"
  REGION: europe-west1
  WIF_PROVIDER: projects/730419163638/locations/global/workloadIdentityPools/github-actions/providers/diewish-staging
  DEPLOY_SERVICE_ACCOUNT: diewish-staging-deployer@project-a2e260c1-839d-4f1d-b90.iam.gserviceaccount.com
  RUNTIME_SERVICE_ACCOUNT: diewish-staging-runtime@project-a2e260c1-839d-4f1d-b90.iam.gserviceaccount.com
  BACKEND_SERVICE: diewish-backend-staging
  FRONTEND_SERVICE: diewish-frontend-staging
  ARTIFACT_REPOSITORY: diewish-staging
  DATABASE_SECRET_NAME: diewish-staging-database-url
  DIRECT_DATABASE_SECRET_NAME: diewish-staging-direct-database-url
  JWT_ACCESS_SECRET_NAME: diewish-staging-jwt-access
  JWT_REFRESH_SECRET_NAME: diewish-staging-jwt-refresh
  DIEWISH_STAGING_SMS_REGIONS: TR
  CUSTOM_FRONTEND_URL: https://staging.diewish.com

jobs:
  deploy-staging:
    # [stage4-release] may start this workflow immediately, but no staging
    # resource is touched until the exact-SHA Hardening + Staging Config gates
    # below are both completed successfully.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[deploy-staging]') || contains(github.event.head_commit.message, '[stage4-release]'))) }}
    name: Deploy isolated staging
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Wait for exact-SHA pre-deploy CI gates
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[stage4-release]') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          required=("Hardening CI" "Staging Config CI")

          for attempt in {1..180}; do
            runs="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=100")"

            ready=1
            for workflow_name in "${required[@]}"; do
              record="$(jq -c --arg name "${workflow_name}" '
                [.workflow_runs[]
                  | select(.name == $name)
                  | {status, conclusion, run_attempt, updated_at}]
                | sort_by(.run_attempt, .updated_at)
                | last // empty
              ' <<<"${runs}")"

              if [[ -z "${record}" ]]; then
                ready=0
                continue
              fi

              status="$(jq -r '.status' <<<"${record}")"
              conclusion="$(jq -r '.conclusion // ""' <<<"${record}")"
              if [[ "${status}" == "completed" && "${conclusion}" != "success" ]]; then
                echo "Pre-deploy gate failed: ${workflow_name} => ${conclusion}" >&2
                exit 1
              fi
              if [[ "${status}" != "completed" || "${conclusion}" != "success" ]]; then
                ready=0
              fi
            done

            if [[ "${ready}" == "1" ]]; then
              echo "Exact-SHA pre-deploy gates passed for ${GITHUB_SHA}."
              exit 0
            fi
            sleep 5
          done

          echo "Timed out waiting for exact-SHA pre-deploy gates." >&2
          exit 1

      - name: Validate staging contract
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${BACKEND_SERVICE}" != *-staging || "${FRONTEND_SERVICE}" != *-staging ]]; then
            echo "Refusing to deploy: staging service names must end in -staging."
            exit 1
          fi
          if [[ "${DEPLOY_SERVICE_ACCOUNT}" != diewish-staging-deployer@* ]]; then
            echo "Refusing to deploy: unexpected deployment identity."
            exit 1
          fi

      - name: Authenticate to Google Cloud with OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Verify staging-only Google Cloud resources
        shell: bash
        run: |
          set -euo pipefail
          gcloud artifacts repositories describe "$ARTIFACT_REPOSITORY" \
            --project "$PROJECT_ID" \
            --location "$REGION" >/dev/null
          gcloud iam service-accounts describe "$RUNTIME_SERVICE_ACCOUNT" \
            --project "$PROJECT_ID" >/dev/null
          for secret in \
            "$DATABASE_SECRET_NAME" \
            "$DIRECT_DATABASE_SECRET_NAME" \
            "$JWT_ACCESS_SECRET_NAME" \
            "$JWT_REFRESH_SECRET_NAME"; do
            gcloud secrets describe "$secret" --project "$PROJECT_ID" >/dev/null
          done

      - name: Migrate staging database and build backend image
        shell: bash
        run: |
          set -euo pipefail
          BACKEND_IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPOSITORY}/backend:${GITHUB_SHA}"
          echo "BACKEND_IMAGE=${BACKEND_IMAGE}" >> "$GITHUB_ENV"
          gcloud builds submit \
            --no-source \
            --project "$PROJECT_ID" \
            --config .github/cloudbuild/backend-staging.yaml \
            --substitutions "_IMAGE=${BACKEND_IMAGE},_GIT_SHA=${GITHUB_SHA}" \
            --quiet

      - name: Deploy backend staging service
        shell: bash
        run: |
          set -euo pipefail
          # Preserve the verified Firebase settings and browser origins from the
          # serving revision. Replacing all variables here disables phone/Google
          # auth until the later frontend build and auth-binding steps finish.
          gcloud run deploy "$BACKEND_SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --platform managed \
            --image "$BACKEND_IMAGE" \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --command=npm \
            --args=start \
            --allow-unauthenticated \
            --cpu 1 \
            --memory 1Gi \
            --concurrency 40 \
            --timeout 120 \
            --min 0 \
            --max 2 \
            --update-env-vars "API_PREFIX=/api,TRUST_PROXY_HOPS=1,RATE_LIMIT_WINDOW_MS=60000,RATE_LIMIT_MAX=600,ENABLE_API_DOCS=false,LOG_LEVEL=info,JWT_ISSUER=diewish-staging,REFRESH_COOKIE_NAME=diewish_staging_refresh,REFRESH_COOKIE_SAME_SITE=lax,STORAGE_PROVIDER=local,AI_PROVIDER=vertex,GOOGLE_CLOUD_PROJECT=${PROJECT_ID},FIREBASE_MESSAGING_SENDER_ID=${PROJECT_NUMBER},VERTEX_AI_LOCATION=global,VERTEX_AI_MODEL=gemini-3.5-flash,USDA_FDC_API_KEY=DEMO_KEY,OPEN_FOOD_FACTS_USER_AGENT=Diewish-Staging/0.1" \
            --set-secrets "DATABASE_URL=${DATABASE_SECRET_NAME}:latest,JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET_NAME}:latest,JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET_NAME}:latest" \
            --quiet

          BACKEND_URL="$(gcloud run services describe "$BACKEND_SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format='value(status.url)')"
          test -n "$BACKEND_URL"
          echo "BACKEND_URL=${BACKEND_URL}" >> "$GITHUB_ENV"

      - name: Build frontend image against staging backend
        shell: bash
        run: |
          set -euo pipefail
          FRONTEND_IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPOSITORY}/frontend:${GITHUB_SHA}"
          echo "FRONTEND_IMAGE=${FRONTEND_IMAGE}" >> "$GITHUB_ENV"
          gcloud builds submit \
            --no-source \
            --project "$PROJECT_ID" \
            --config .github/cloudbuild/frontend-staging.yaml \
            --substitutions "_IMAGE=${FRONTEND_IMAGE},_GIT_SHA=${GITHUB_SHA},_API_BASE_URL=/api,_API_PROXY_TARGET=${BACKEND_URL},_SITE_URL=${CUSTOM_FRONTEND_URL}" \
            --quiet

      - name: Deploy frontend staging service
        shell: bash
        run: |
          set -euo pipefail
          # Browser API calls are proxied through this service. Its request
          # timeout must outlive the backend's 120-second synchronous analysis
          # window; otherwise the proxy can fail first while the backend later
          # persists a successful blood-test result.
          gcloud run deploy "$FRONTEND_SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --platform managed \
            --image "$FRONTEND_IMAGE" \
            --allow-unauthenticated \
            --cpu 1 \
            --memory 512Mi \
            --concurrency 80 \
            --timeout 180 \
            --min 0 \
            --max 2 \
            --quiet

          FRONTEND_URL="$(gcloud run services describe "$FRONTEND_SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format='value(status.url)')"
          test -n "$FRONTEND_URL"
          echo "FRONTEND_URL=${FRONTEND_URL}" >> "$GITHUB_ENV"

      - name: Configure and verify staging Authentication providers
        shell: bash
        run: bash scripts/configure-staging-auth.sh

      - name: Bind backend to staging frontend and Firebase Auth
        shell: bash
        run: |
          set -euo pipefail
          # CORS_ORIGIN itself is comma-separated, so use a custom gcloud flag
          # delimiter to preserve every legitimate staging browser origin as one value.
          gcloud run services update "$BACKEND_SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --update-env-vars "^|^CORS_ORIGIN=${FRONTEND_URL},${CANONICAL_FRONTEND_URL},${CUSTOM_FRONTEND_URL}|APP_WEB_URL=${CUSTOM_FRONTEND_URL}|FIREBASE_WEB_API_KEY=${FIREBASE_WEB_API_KEY}|FIREBASE_AUTH_DOMAIN=${FIREBASE_AUTH_DOMAIN}|FIREBASE_WEB_APP_ID=${FIREBASE_WEB_APP_ID}|FIREBASE_MESSAGING_SENDER_ID=${PROJECT_NUMBER}" \
            --quiet

      - name: Verify staging health and Authentication runtime
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            if curl --fail --silent --show-error "${BACKEND_URL}/api/health" >/dev/null; then
              break
            fi
            if [[ "$attempt" == "30" ]]; then
              echo "Staging backend health check failed."
              exit 1
            fi
            sleep 2
          done

          # Verify every legitimate browser origin, including the stable custom
          # hostname, before auth testing.
          for frontend_origin in "$FRONTEND_URL" "$CANONICAL_FRONTEND_URL" "$CUSTOM_FRONTEND_URL"; do
            cors_headers="$(curl --silent --show-error --dump-header - --output /dev/null \
              -H "Origin: ${frontend_origin}" \
              "${BACKEND_URL}/api/health" | tr -d '\r')"
            if ! grep -Fqi "access-control-allow-origin: ${frontend_origin}" <<<"$cors_headers"; then
              echo "Backend CORS rejected staging origin ${frontend_origin}." >&2
              exit 1
            fi
          done

          for frontend_origin in "$FRONTEND_URL" "$CANONICAL_FRONTEND_URL" "$CUSTOM_FRONTEND_URL"; do
            for path in /login /phone-auth /api/health; do
              for attempt in {1..30}; do
                if curl --fail --silent --show-error "${frontend_origin}${path}" >/dev/null; then
                  break
                fi
                if [[ "$attempt" == "30" ]]; then
                  echo "Staging frontend runtime check failed: ${frontend_origin}${path}" >&2
                  exit 1
                fi
                sleep 2
              done
            done
          done

          for frontend_origin in "$FRONTEND_URL" "$CANONICAL_FRONTEND_URL" "$CUSTOM_FRONTEND_URL"; do
            auth_config=""
            for attempt in {1..30}; do
              auth_config="$(curl --fail --silent --show-error "${frontend_origin}/api/identity/firebase-config" || true)"
              if jq -e '.success == true and .data.configured == true and (.data.config.apiKey | length > 0) and (.data.config.authDomain | length > 0) and (.data.config.appId | length > 0) and (.data.config.messagingSenderId | length > 0)' >/dev/null 2>&1 <<<"$auth_config"; then
                break
              fi
              if [[ "$attempt" == "30" ]]; then
                echo "Staging Firebase runtime config is not active for ${frontend_origin}." >&2
                exit 1
              fi
              sleep 2
            done

            probe_body="$(jq -cn \
              --arg identifier 'staging-auth-probe@diewish.invalid' \
              --arg continueUri "${frontend_origin}/login" \
              '{identifier:$identifier,continueUri:$continueUri}')"
            auth_uri_probe="$(curl --silent --show-error \
              -H 'Content-Type: application/json' \
              -X POST \
              -d "$probe_body" \
              "https://identitytoolkit.googleapis.com/v1/accounts:createAuthUri?key=${FIREBASE_WEB_API_KEY}" || true)"
            if jq -e '.error' >/dev/null 2>&1 <<<"$auth_uri_probe"; then
              echo "Firebase rejected staging OAuth origin ${frontend_origin}: $(jq -r '.error.message // "unknown error"' <<<"$auth_uri_probe")" >&2
              exit 1
            fi
          done

      - name: Resolve staging Android Firebase config
        shell: bash
        run: |
          set -euo pipefail
          package_name="com.diewish.app"
          auth_header="Authorization: Bearer $(gcloud auth print-access-token)"
          apps_file="$(mktemp)"
          apps_code="$(curl --silent --show-error -o "$apps_file" -w '%{http_code}' \
            -H "$auth_header" \
            -H "x-goog-user-project: ${PROJECT_ID}" \
            "https://firebase.googleapis.com/v1beta1/projects/${PROJECT_ID}/androidApps")"
          if [[ "$apps_code" != "200" ]]; then
            echo "Could not read isolated staging Firebase Android apps (HTTP ${apps_code})." >&2
            rm -f "$apps_file"
            exit 1
          fi

          android_app_name="$(jq -r --arg package "$package_name" '(.apps // [])[] | select(.packageName == $package) | .name' "$apps_file" | head -n 1)"
          rm -f "$apps_file"

          # Android app registration is a one-time infrastructure bootstrap
          # operation. The deployment identity intentionally cannot self-escalate
          # or create Firebase clients. Fail closed with an actionable message.
          if [[ -z "$android_app_name" ]]; then
            echo "Staging Firebase Android app com.diewish.app is missing; refusing to build an APK without FCM." >&2
            echo "Run scripts/bootstrap-staging-auth-gcp.sh once with an authorized staging project administrator, then re-run this staging deploy." >&2
            exit 1
          fi

          config_file="$(mktemp)"
          config_code="$(curl --silent --show-error -o "$config_file" -w '%{http_code}' \
            -H "$auth_header" \
            -H "x-goog-user-project: ${PROJECT_ID}" \
            "https://firebase.googleapis.com/v1beta1/${android_app_name}/config")"
          if [[ "$config_code" != "200" ]]; then
            echo "Could not read staging Firebase Android client config (HTTP ${config_code})." >&2
            rm -f "$config_file"
            exit 1
          fi

          config_b64="$(jq -r '.configFileContents // empty' "$config_file")"
          rm -f "$config_file"
          if [[ -z "$config_b64" ]]; then
            echo "Staging Firebase Android config payload is empty." >&2
            exit 1
          fi

          decoded_config="$(mktemp)"
          printf '%s' "$config_b64" | base64 --decode > "$decoded_config"
          client_json="$(jq -c --arg package "$package_name" '.client[] | select(.client_info.android_client_info.package_name == $package)' "$decoded_config" | head -n 1)"
          firebase_project_id="$(jq -r '.project_info.project_id // empty' "$decoded_config")"
          firebase_sender_id="$(jq -r '.project_info.project_number // empty' "$decoded_config")"
          rm -f "$decoded_config"

          if [[ -z "$client_json" ]]; then
            echo "Staging Firebase Android config does not contain ${package_name}." >&2
            exit 1
          fi
          firebase_app_id="$(jq -r '.client_info.mobilesdk_app_id // empty' <<<"$client_json")"
          firebase_api_key="$(jq -r '.api_key[0].current_key // empty' <<<"$client_json")"

          if [[ "$firebase_project_id" != "$PROJECT_ID" || "$firebase_sender_id" != "$PROJECT_NUMBER" ]]; then
            echo "Refusing APK build: staging Firebase project identity mismatch." >&2
            exit 1
          fi
          if [[ -z "$firebase_app_id" || -z "$firebase_api_key" ]]; then
            echo "Staging Firebase Android client config is incomplete." >&2
            exit 1
          fi

          echo "::add-mask::${firebase_app_id}"
          echo "::add-mask::${firebase_api_key}"
          {
            echo "DIEWISH_FIREBASE_PROJECT_ID=${firebase_project_id}"
            echo "DIEWISH_FIREBASE_APP_ID=${firebase_app_id}"
            echo "DIEWISH_FIREBASE_API_KEY=${firebase_api_key}"
            echo "DIEWISH_FIREBASE_SENDER_ID=${firebase_sender_id}"
            echo "DIEWISH_ANDROID_FCM_STATUS=verified"
          } >> "$GITHUB_ENV"

      - name: Set up JDK 17 for staging APK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build and test staging-bound Android APK
        shell: bash
        run: |
          set -euo pipefail
          test "$CUSTOM_FRONTEND_URL" = "https://staging.diewish.com"
          test "${DIEWISH_ANDROID_FCM_STATUS:-}" = "verified"

          gradle --no-daemon -p android :app:testDebugUnitTest :app:assembleDebug \
            -PDIEWISH_WEB_BASE_URL="${CUSTOM_FRONTEND_URL}" \
            -PDIEWISH_FIREBASE_PROJECT_ID="${DIEWISH_FIREBASE_PROJECT_ID}" \
            -PDIEWISH_FIREBASE_APP_ID="${DIEWISH_FIREBASE_APP_ID}" \
            -PDIEWISH_FIREBASE_API_KEY="${DIEWISH_FIREBASE_API_KEY}" \
            -PDIEWISH_FIREBASE_SENDER_ID="${DIEWISH_FIREBASE_SENDER_ID}"

          short_sha="${GITHUB_SHA::7}"
          mkdir -p android/app/build/staging-apk
          apk="android/app/build/staging-apk/Diewish-staging-${short_sha}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$apk"
          sha256sum "$apk" > "${apk}.sha256"
          cat > android/app/build/staging-apk/staging-manifest.txt <<EOF
          commit=${GITHUB_SHA}
          environment=staging
          frontend=${FRONTEND_URL}
          canonical_frontend=${CANONICAL_FRONTEND_URL}
          custom_frontend=${CUSTOM_FRONTEND_URL}
          backend=${BACKEND_URL}
          api_base=/api
          auth=google+phone
          fcm_status=${DIEWISH_ANDROID_FCM_STATUS}
          fcm_project=${DIEWISH_FIREBASE_PROJECT_ID}
          sms_regions=${DIEWISH_STAGING_SMS_REGIONS}
          database_project=shiny-hill-56015697
          EOF

      - name: Upload staging APK
        uses: actions/upload-artifact@v4
        with:
          name: diewish-staging-apk-${{ github.run_number }}
          path: android/app/build/staging-apk/
          if-no-files-found: error
          retention-days: 7

      - name: Staging summary
        shell: bash
        run: |
          {
            echo "## Diewish staging preview"
            echo ""
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Frontend status URL: ${FRONTEND_URL}"
            echo "- Frontend canonical URL: ${CANONICAL_FRONTEND_URL}"
            echo "- Frontend custom URL: ${CUSTOM_FRONTEND_URL}"
            echo "- Backend: ${BACKEND_URL}"
            echo "- Browser API: same-origin ${FRONTEND_URL}/api"
            echo "- Authentication: Google + phone enabled; anonymous disabled; Cloud Run and custom staging origins authorized"
            echo "- Android FCM: ${DIEWISH_ANDROID_FCM_STATUS} (mandatory for staging APK)"
            echo "- Web FCM config: messaging sender verified; browser permission/token validated at runtime"
            echo "- SMS regions: ${DIEWISH_STAGING_SMS_REGIONS}"
            echo "- Database: isolated Diewish Staging Neon project"
            echo "- Migration: direct Neon endpoint via Cloud Build"
            echo "- USDA: official low-limit DEMO_KEY (staging only)"
            echo "- APK artifact: \`diewish-staging-apk-${GITHUB_RUN_NUMBER}\`"
          } >> "$GITHUB_STEP_SUMMARY"
