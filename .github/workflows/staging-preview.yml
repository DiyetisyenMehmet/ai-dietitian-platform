name: Staging Preview Deploy

on:
  push:
    branches:
      - feature/staging-preview
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: diewish-staging-preview
  cancel-in-progress: false

env:
  PROJECT_ID: project-a2e260c1-839d-4f1d-b90
  REGION: europe-west1
  WIF_PROVIDER: projects/730419163638/locations/global/workloadIdentityPools/github-actions/providers/diewish-staging
  DEPLOY_SERVICE_ACCOUNT: diewish-staging-deployer@project-a2e260c1-839d-4f1d-b90.iam.gserviceaccount.com
  RUNTIME_SERVICE_ACCOUNT: diewish-staging-runtime@project-a2e260c1-839d-4f1d-b90.iam.gserviceaccount.com
  BACKEND_SERVICE: diewish-backend-staging
  FRONTEND_SERVICE: diewish-frontend-staging
  ARTIFACT_REPOSITORY: diewish-staging
  DATABASE_SECRET_NAME: diewish-staging-database-url
  DIRECT_DATABASE_SECRET_NAME: diewish-staging-direct-database-url
  JWT_ACCESS_SECRET_NAME: diewish-staging-jwt-access
  JWT_REFRESH_SECRET_NAME: diewish-staging-jwt-refresh

jobs:
  deploy-staging:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-staging]')) }}
    name: Deploy isolated staging
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Validate staging contract
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${BACKEND_SERVICE}" != *-staging || "${FRONTEND_SERVICE}" != *-staging ]]; then
            echo "Refusing to deploy: staging service names must end in -staging."
            exit 1
          fi
          if [[ "${DEPLOY_SERVICE_ACCOUNT}" != diewish-staging-deployer@* ]]; then
            echo "Refusing to deploy: unexpected deployment identity."
            exit 1
          fi

      - name: Authenticate to Google Cloud with OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Verify staging-only Google Cloud resources
        shell: bash
        run: |
          set -euo pipefail
          gcloud artifacts repositories describe "$ARTIFACT_REPOSITORY" \
            --project "$PROJECT_ID" \
            --location "$REGION" >/dev/null
          gcloud iam service-accounts describe "$RUNTIME_SERVICE_ACCOUNT" \
            --project "$PROJECT_ID" >/dev/null
          for secret in \
            "$DATABASE_SECRET_NAME" \
            "$DIRECT_DATABASE_SECRET_NAME" \
            "$JWT_ACCESS_SECRET_NAME" \
            "$JWT_REFRESH_SECRET_NAME"; do
            gcloud secrets describe "$secret" --project "$PROJECT_ID" >/dev/null
          done

      - name: Migrate staging database and build backend image
        shell: bash
        run: |
          set -euo pipefail
          BACKEND_IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPOSITORY}/backend:${GITHUB_SHA}"
          echo "BACKEND_IMAGE=${BACKEND_IMAGE}" >> "$GITHUB_ENV"
          gcloud builds submit \
            --no-source \
            --project "$PROJECT_ID" \
            --config .github/cloudbuild/backend-staging.yaml \
            --substitutions "_IMAGE=${BACKEND_IMAGE},_GIT_SHA=${GITHUB_SHA}" \
            --quiet

      - name: Deploy backend staging service
        shell: bash
        run: |
          set -euo pipefail
          gcloud run deploy "$BACKEND_SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --platform managed \
            --image "$BACKEND_IMAGE" \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --command=npm \
            --args=start \
            --allow-unauthenticated \
            --cpu 1 \
            --memory 1Gi \
            --concurrency 40 \
            --timeout 120 \
            --min 0 \
            --max 2 \
            --set-env-vars "API_PREFIX=/api,CORS_ORIGIN=https://staging.invalid,TRUST_PROXY_HOPS=1,ENABLE_API_DOCS=false,LOG_LEVEL=info,JWT_ISSUER=diewish-staging,REFRESH_COOKIE_NAME=diewish_staging_refresh,REFRESH_COOKIE_SAME_SITE=lax,APP_WEB_URL=https://staging.invalid,STORAGE_PROVIDER=local,AI_PROVIDER=vertex,GOOGLE_CLOUD_PROJECT=${PROJECT_ID},VERTEX_AI_LOCATION=global,VERTEX_AI_MODEL=gemini-3.5-flash,USDA_FDC_API_KEY=DEMO_KEY,OPEN_FOOD_FACTS_USER_AGENT=Diewish-Staging/0.1" \
            --set-secrets "DATABASE_URL=${DATABASE_SECRET_NAME}:latest,JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET_NAME}:latest,JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET_NAME}:latest" \
            --quiet

          BACKEND_URL="$(gcloud run services describe "$BACKEND_SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format='value(status.url)')"
          test -n "$BACKEND_URL"
          echo "BACKEND_URL=${BACKEND_URL}" >> "$GITHUB_ENV"

      - name: Build frontend image against staging backend
        shell: bash
        run: |
          set -euo pipefail
          FRONTEND_IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPOSITORY}/frontend:${GITHUB_SHA}"
          echo "FRONTEND_IMAGE=${FRONTEND_IMAGE}" >> "$GITHUB_ENV"
          gcloud builds submit \
            --no-source \
            --project "$PROJECT_ID" \
            --config .github/cloudbuild/frontend-staging.yaml \
            --substitutions "_IMAGE=${FRONTEND_IMAGE},_GIT_SHA=${GITHUB_SHA},_API_BASE_URL=/api,_API_PROXY_TARGET=${BACKEND_URL},_SITE_URL=https://staging.invalid" \
            --quiet

      - name: Deploy frontend staging service
        shell: bash
        run: |
          set -euo pipefail
          gcloud run deploy "$FRONTEND_SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --platform managed \
            --image "$FRONTEND_IMAGE" \
            --allow-unauthenticated \
            --cpu 1 \
            --memory 512Mi \
            --concurrency 80 \
            --timeout 60 \
            --min 0 \
            --max 2 \
            --quiet

          FRONTEND_URL="$(gcloud run services describe "$FRONTEND_SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format='value(status.url)')"
          test -n "$FRONTEND_URL"
          echo "FRONTEND_URL=${FRONTEND_URL}" >> "$GITHUB_ENV"

      - name: Bind backend CORS to the staging frontend only
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services update "$BACKEND_SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --update-env-vars "CORS_ORIGIN=${FRONTEND_URL},APP_WEB_URL=${FRONTEND_URL}" \
            --quiet

      - name: Verify staging health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            if curl --fail --silent --show-error "${BACKEND_URL}/api/health" >/dev/null; then
              break
            fi
            if [[ "$attempt" == "30" ]]; then
              echo "Staging backend health check failed."
              exit 1
            fi
            sleep 2
          done

          for attempt in {1..30}; do
            if curl --fail --silent --show-error "${FRONTEND_URL}/register" >/dev/null; then
              break
            fi
            if [[ "$attempt" == "30" ]]; then
              echo "Staging frontend health check failed."
              exit 1
            fi
            sleep 2
          done

          for attempt in {1..30}; do
            if curl --fail --silent --show-error "${FRONTEND_URL}/api/health" >/dev/null; then
              break
            fi
            if [[ "$attempt" == "30" ]]; then
              echo "Staging same-origin API proxy health check failed."
              exit 1
            fi
            sleep 2
          done

      - name: Set up JDK 17 for staging APK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build staging-bound Android APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon -p android :app:assembleDebug \
            -PDIEWISH_WEB_BASE_URL="${FRONTEND_URL}"

          short_sha="${GITHUB_SHA::7}"
          mkdir -p android/app/build/staging-apk
          apk="android/app/build/staging-apk/Diewish-staging-${short_sha}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$apk"
          sha256sum "$apk" > "${apk}.sha256"
          cat > android/app/build/staging-apk/staging-manifest.txt <<EOF
          commit=${GITHUB_SHA}
          environment=staging
          frontend=${FRONTEND_URL}
          backend=${BACKEND_URL}
          api_base=/api
          database_project=shiny-hill-56015697
          EOF

      - name: Upload staging APK
        uses: actions/upload-artifact@v4
        with:
          name: diewish-staging-apk-${{ github.run_number }}
          path: android/app/build/staging-apk/
          if-no-files-found: error
          retention-days: 7

      - name: Staging summary
        shell: bash
        run: |
          {
            echo "## Diewish staging preview"
            echo ""
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Frontend: ${FRONTEND_URL}"
            echo "- Backend: ${BACKEND_URL}"
            echo "- Browser API: same-origin ${FRONTEND_URL}/api"
            echo "- Database: isolated Diewish Staging Neon project"
            echo "- Migration: direct Neon endpoint via Cloud Build"
            echo "- USDA: official low-limit DEMO_KEY (staging only)"
            echo "- APK artifact: \`diewish-staging-apk-${GITHUB_RUN_NUMBER}\`"
          } >> "$GITHUB_STEP_SUMMARY"
