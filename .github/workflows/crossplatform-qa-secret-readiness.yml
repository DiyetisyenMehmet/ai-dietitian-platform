name: Cross-platform QA Secret Readiness

on:
  push:
    branches: [feature/workmode4-crossplatform-qa-infra-a1]
    paths: [".github/workflows/crossplatform-qa-secret-readiness.yml"]
  workflow_dispatch:

permissions: {}

jobs:
  secret-presence:
    if: github.ref == 'refs/heads/feature/workmode4-crossplatform-qa-infra-a1'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 3
    steps:
      # Re-check after environment setup using a fresh workflow run.
      # Expressions expose presence only, never the underlying secret material.
      # Existing environment approvals and branch restrictions remain enforced.
      - name: Check staging QA secret availability without reading values
        env:
          QA_EMAIL_PRESENT: ${{ secrets.QA_EMAIL != '' }}
          QA_PASSWORD_PRESENT: ${{ secrets.QA_PASSWORD != '' }}
          QA_ACCOUNT_ID_PRESENT: ${{ secrets.QA_ACCOUNT_ID != '' }}
          QA_ACCOUNT_HMAC_KEY_PRESENT: ${{ secrets.QA_ACCOUNT_HMAC_KEY != '' }}
          QA_EMAIL_ALLOWED: ${{ secrets.QA_EMAIL == 'diewishdestek@gmail.com' }}
        run: |
          python3 - <<'PY'
          import json, os
          names = ("QA_EMAIL", "QA_PASSWORD", "QA_ACCOUNT_ID", "QA_ACCOUNT_HMAC_KEY")
          print(json.dumps({"secretPresence": {name: os.environ[name + "_PRESENT"] == "true" for name in names}, "authorizedEmailMatches": os.environ["QA_EMAIL_ALLOWED"] == "true"}, sort_keys=True))
          PY
