name: Cross-platform QA Infrastructure

on:
  push:
    branches: [feature/workmode4-crossplatform-qa-infra-a1]
    paths: ["qa/platform/**", "ios/**", ".github/workflows/crossplatform-qa-infra.yml"]
  workflow_dispatch:
    inputs:
      authenticated:
        description: "Run dedicated synthetic staging account checks (requires approved staging secrets)"
        type: boolean
        default: false
      platform:
        description: "Runtime to run"
        type: choice
        options: [all, web, android, ios]
        default: all

permissions:
  contents: read

concurrency:
  group: qa-infra-${{ github.ref }}
  cancel-in-progress: false

env:
  QA_BASE_URL: https://staging.diewish.com
  QA_TIMEZONE: Europe/Istanbul
  QA_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  contracts:
    if: github.ref == 'refs/heads/feature/workmode4-crossplatform-qa-infra-a1' || github.ref == 'refs/heads/feature/staging-preview'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      web: ${{ steps.scope.outputs.web }}
      android: ${{ steps.scope.outputs.android }}
      ios: ${{ steps.scope.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Bound expensive runtime jobs
        id: scope
        if: github.event_name == 'push'
        run: python3 qa/platform/ci-scope.py
      - run: node --test qa/platform/*.test.cjs
      - run: python3 -m unittest discover -s qa/platform -p '*_test.py'
      - run: bash -n qa/platform/ios-run.sh

  web:
    needs: contracts
    if: (github.event_name == 'push' && needs.contracts.outputs.web == 'true') || (github.event_name == 'workflow_dispatch' && (inputs.platform == 'all' || inputs.platform == 'web'))
    runs-on: ubuntu-latest
    environment: ${{ inputs.authenticated && 'staging' || '' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npx --prefix frontend playwright install --with-deps ${{ matrix.engine }}
      - name: Real browser evidence (no traces, HAR, cookies or storage export)
        env:
          QA_EMAIL: ${{ inputs.authenticated && secrets.QA_EMAIL || '' }}
          QA_PASSWORD: ${{ inputs.authenticated && secrets.QA_PASSWORD || '' }}
          QA_ACCOUNT_ID: ${{ inputs.authenticated && secrets.QA_ACCOUNT_ID || '' }}
          QA_ACCOUNT_HMAC_KEY: ${{ inputs.authenticated && secrets.QA_ACCOUNT_HMAC_KEY || '' }}
          QA_SYNTHETIC_ACCOUNT: ${{ inputs.authenticated && 'YES' || '' }}
          QA_AUTHENTICATED_REQUIRED: ${{ inputs.authenticated && 'YES' || 'NO' }}
        run: node qa/platform/runtime.cjs web ${{ matrix.engine }}
      - name: Validate export safety
        id: export-safety
        if: always()
        run: node qa/platform/verify-artifacts.cjs
      - uses: actions/upload-artifact@v4
        if: always() && steps.export-safety.outcome == 'success'
        with:
          name: qa-web-${{ matrix.engine }}-${{ github.run_id }}
          path: .qa-artifacts/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  android:
    needs: contracts
    if: (github.event_name == 'push' && needs.contracts.outputs.android == 'true') || (github.event_name == 'workflow_dispatch' && (inputs.platform == 'all' || inputs.platform == 'android'))
    runs-on: ubuntu-latest
    environment: ${{ inputs.authenticated && 'staging' || '' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - run: gradle --no-daemon -p android :app:testDebugUnitTest :app:assembleDebug -PDIEWISH_WEB_BASE_URL=https://staging.diewish.com
      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Real Android Emulator evidence
        uses: reactivecircus/android-emulator-runner@v2
        env:
          QA_EMAIL: ${{ inputs.authenticated && secrets.QA_EMAIL || '' }}
          QA_PASSWORD: ${{ inputs.authenticated && secrets.QA_PASSWORD || '' }}
          QA_ACCOUNT_ID: ${{ inputs.authenticated && secrets.QA_ACCOUNT_ID || '' }}
          QA_ACCOUNT_HMAC_KEY: ${{ inputs.authenticated && secrets.QA_ACCOUNT_HMAC_KEY || '' }}
          QA_SYNTHETIC_ACCOUNT: ${{ inputs.authenticated && 'YES' || '' }}
          QA_AUTHENTICATED_REQUIRED: ${{ inputs.authenticated && 'YES' || 'NO' }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            node qa/platform/runtime.cjs android
      - name: Validate export safety
        id: export-safety
        if: always()
        run: node qa/platform/verify-artifacts.cjs
      - uses: actions/upload-artifact@v4
        if: always() && steps.export-safety.outcome == 'success'
        with:
          name: qa-android-emulator-${{ github.run_id }}
          path: .qa-artifacts/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  ios:
    needs: contracts
    if: (github.event_name == 'push' && needs.contracts.outputs.ios == 'true') || (github.event_name == 'workflow_dispatch' && (inputs.platform == 'all' || inputs.platform == 'ios'))
    runs-on: macos-15
    environment: ${{ inputs.authenticated && 'staging' || '' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Real iOS Simulator build, launch, XCTest and screenshot
        env:
          QA_EMAIL: ${{ inputs.authenticated && secrets.QA_EMAIL || '' }}
          QA_PASSWORD: ${{ inputs.authenticated && secrets.QA_PASSWORD || '' }}
          QA_ACCOUNT_ID: ${{ inputs.authenticated && secrets.QA_ACCOUNT_ID || '' }}
          QA_ACCOUNT_HMAC_KEY: ${{ inputs.authenticated && secrets.QA_ACCOUNT_HMAC_KEY || '' }}
          QA_SYNTHETIC_ACCOUNT: ${{ inputs.authenticated && 'YES' || '' }}
          QA_AUTHENTICATED_REQUIRED: ${{ inputs.authenticated && 'YES' || 'NO' }}
        run: bash qa/platform/ios-run.sh
      - name: Validate export safety
        id: export-safety
        if: always()
        run: node qa/platform/verify-artifacts.cjs
      - uses: actions/upload-artifact@v4
        if: always() && steps.export-safety.outcome == 'success'
        with:
          name: qa-ios-simulator-${{ github.run_id }}
          path: .qa-artifacts/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
