name: Cross-platform QA Infrastructure

on:
  push:
    branches: [feature/workmode4-crossplatform-qa-infra-a1]
    paths: ["qa/platform/**", "ios/**", "frontend/**", "android/**", ".github/workflows/crossplatform-qa-infra.yml"]
  workflow_dispatch:
    inputs:
      authenticated:
        description: "Run dedicated synthetic staging account checks (requires approved staging secrets)"
        type: boolean
        default: false
      platform:
        description: "Runtime to run"
        type: choice
        options: [all, web, android, ios]
        default: all
      android_source_ref:
        description: "Optional immutable Android product commit; QA harness remains on the QA branch"
        type: string
        default: ""
      android_operation:
        description: "Existing Android runtime operation"
        type: choice
        options: [smoke, sync-android-to-web, sync-web-to-android]
        default: smoke
  workflow_call:
    inputs:
      authenticated:
        type: boolean
        required: true
      platform:
        type: string
        required: true
      android_source_ref:
        type: string
        required: false
        default: ""
      android_operation:
        type: string
        required: false
        default: smoke

permissions:
  contents: read

concurrency:
  group: qa-infra-${{ inputs.authenticated && 'authenticated' || 'public' }}-${{ github.ref }}-${{ inputs.android_operation || 'smoke' }}
  cancel-in-progress: true

env:
  QA_BASE_URL: https://staging.diewish.com
  QA_TIMEZONE: Europe/Istanbul
  QA_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  contracts:
    if: github.ref == 'refs/heads/feature/workmode4-crossplatform-qa-infra-a1' || github.ref == 'refs/heads/feature/staging-preview'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      web: ${{ steps.scope.outputs.web }}
      android: ${{ steps.scope.outputs.android }}
      ios: ${{ steps.scope.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Bound expensive runtime jobs
        id: scope
        if: github.event_name == 'push'
        run: python3 qa/platform/ci-scope.py
      - run: node --test qa/platform/*.test.cjs
      - run: python3 -m unittest discover -s qa/platform -p '*_test.py'
      - run: bash -n qa/platform/ios-run.sh
      - name: Validate health masking in a real DOM before any authenticated runtime
        if: inputs.android_operation == 'smoke' || !inputs.android_operation
        run: |
          npm ci --prefix frontend
          npx --prefix frontend playwright install --with-deps chromium webkit
          node --test qa/platform/health-screenshot.spec.cjs
          QA_BROWSER_ENGINE=webkit node --test qa/platform/health-screenshot.spec.cjs

  web:
    needs: contracts
    if: (github.event_name == 'push' && !inputs.authenticated && needs.contracts.outputs.web == 'true') || ((inputs.authenticated || github.event_name == 'workflow_dispatch') && (inputs.platform == 'all' || inputs.platform == 'web'))
    runs-on: ubuntu-latest
    environment: ${{ inputs.authenticated && 'staging' || '' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npx --prefix frontend playwright install --with-deps ${{ matrix.engine }}
      - name: Credential screenshot guard in a real DOM fixture
        env:
          QA_BROWSER_ENGINE: ${{ matrix.engine }}
        run: node --test qa/platform/credential-screenshot.spec.cjs
      - name: Real browser evidence (no traces, HAR, cookies or storage export)
        env:
          QA_EMAIL: ${{ inputs.authenticated && secrets.QA_EMAIL || '' }}
          QA_PASSWORD: ${{ inputs.authenticated && secrets.QA_PASSWORD || '' }}
          QA_ACCOUNT_ID: ${{ inputs.authenticated && secrets.QA_ACCOUNT_ID || '' }}
          QA_ACCOUNT_HMAC_KEY: ${{ inputs.authenticated && secrets.QA_ACCOUNT_HMAC_KEY || '' }}
          QA_SYNTHETIC_ACCOUNT: ${{ inputs.authenticated && 'YES' || '' }}
          QA_AUTHENTICATED_REQUIRED: ${{ inputs.authenticated && 'YES' || 'NO' }}
        run: node qa/platform/authenticated-run.cjs web ${{ matrix.engine }}
      - name: Validate export safety
        id: export-safety
        if: always()
        run: node qa/platform/verify-artifacts.cjs
      - uses: actions/upload-artifact@v4
        if: always() && steps.export-safety.outcome == 'success'
        with:
          name: qa-web-${{ matrix.engine }}-${{ github.run_id }}
          path: .qa-artifacts/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  android:
    needs: contracts
    if: (github.event_name == 'push' && !inputs.authenticated && needs.contracts.outputs.android == 'true') || ((inputs.authenticated || github.event_name == 'workflow_dispatch') && (inputs.platform == 'all' || inputs.platform == 'android'))
    runs-on: ubuntu-latest
    environment: ${{ inputs.authenticated && 'staging' || '' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate immutable Android source selection
        if: inputs.android_source_ref != ''
        env:
          ANDROID_SOURCE_REF: ${{ inputs.android_source_ref }}
        run: |
          if [[ ! "$ANDROID_SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'ANDROID_PRODUCT_SOURCE FAIL INVALID_COMMIT'
            exit 1
          fi
      - name: Check out Android product source separately from QA
        if: inputs.android_source_ref != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.android_source_ref }}
          path: .qa-private/android-product-source
          sparse-checkout: android
          persist-credentials: false
      - name: Select verified native build source; preserve QA harness
        if: inputs.android_source_ref != ''
        env:
          ANDROID_SOURCE_REF: ${{ inputs.android_source_ref }}
        run: |
          source_dir=.qa-private/android-product-source
          actual_sha=$(git -C "$source_dir" rev-parse HEAD)
          test "$actual_sha" = "$ANDROID_SOURCE_REF"
          actual_tree=$(git -C "$source_dir" rev-parse 'HEAD^{tree}')
          rsync --archive --delete "$source_dir/android/" android/
          git diff --exit-code -- qa/platform frontend ios
          echo "ANDROID_PRODUCT_SOURCE PASS HEAD=$actual_sha TREE=$actual_tree"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Build and unit-test selected staging Android source
        env:
          ANDROID_BUILD_SHA: ${{ inputs.android_source_ref || github.sha }}
        run: GITHUB_SHA="$ANDROID_BUILD_SHA" gradle --no-daemon -p android :app:testDebugUnitTest :app:assembleDebug -PDIEWISH_WEB_BASE_URL=https://staging.diewish.com
      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install actual browser for simultaneous native/browser synchronization
        if: inputs.android_operation != 'smoke' && inputs.android_operation != ''
        run: npx --prefix frontend playwright install --with-deps chromium
      - name: Real Android Emulator evidence
        timeout-minutes: 12
        uses: reactivecircus/android-emulator-runner@v2
        env:
          QA_EMAIL: ${{ inputs.authenticated && secrets.QA_EMAIL || '' }}
          QA_PASSWORD: ${{ inputs.authenticated && secrets.QA_PASSWORD || '' }}
          QA_ACCOUNT_ID: ${{ inputs.authenticated && secrets.QA_ACCOUNT_ID || '' }}
          QA_ACCOUNT_HMAC_KEY: ${{ inputs.authenticated && secrets.QA_ACCOUNT_HMAC_KEY || '' }}
          QA_SYNTHETIC_ACCOUNT: ${{ inputs.authenticated && 'YES' || '' }}
          QA_AUTHENTICATED_REQUIRED: ${{ inputs.authenticated && 'YES' || 'NO' }}
          QA_ANDROID_OPERATION: ${{ inputs.android_operation || 'smoke' }}
          QA_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.android_operation || 'smoke' }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-boot-timeout: 180
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated
          script: bash qa/platform/android-ci-run.sh
      - name: Validate export safety
        id: export-safety
        if: always()
        run: node qa/platform/verify-artifacts.cjs
      - uses: actions/upload-artifact@v4
        if: always() && steps.export-safety.outcome == 'success'
        with:
          name: qa-android-emulator-${{ inputs.android_operation || 'smoke' }}-${{ github.run_id }}
          path: .qa-artifacts/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  ios:
    needs: contracts
    if: (github.event_name == 'push' && !inputs.authenticated && needs.contracts.outputs.ios == 'true') || ((inputs.authenticated || github.event_name == 'workflow_dispatch') && (inputs.platform == 'all' || inputs.platform == 'ios'))
    runs-on: macos-15
    environment: ${{ inputs.authenticated && 'staging' || '' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Real iOS Simulator build, launch, XCTest and screenshot
        env:
          QA_EMAIL: ${{ inputs.authenticated && secrets.QA_EMAIL || '' }}
          QA_PASSWORD: ${{ inputs.authenticated && secrets.QA_PASSWORD || '' }}
          QA_ACCOUNT_ID: ${{ inputs.authenticated && secrets.QA_ACCOUNT_ID || '' }}
          QA_ACCOUNT_HMAC_KEY: ${{ inputs.authenticated && secrets.QA_ACCOUNT_HMAC_KEY || '' }}
          QA_SYNTHETIC_ACCOUNT: ${{ inputs.authenticated && 'YES' || '' }}
          QA_AUTHENTICATED_REQUIRED: ${{ inputs.authenticated && 'YES' || 'NO' }}
        run: node qa/platform/authenticated-run.cjs ios
      - name: Validate export safety
        id: export-safety
        if: always()
        run: node qa/platform/verify-artifacts.cjs
      - uses: actions/upload-artifact@v4
        if: always() && steps.export-safety.outcome == 'success'
        with:
          name: qa-ios-simulator-${{ github.run_id }}
          path: .qa-artifacts/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
