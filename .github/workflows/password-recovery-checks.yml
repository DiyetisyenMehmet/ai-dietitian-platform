name: Password recovery checks
on:
  push:
    branches: [feature/app10-password-reset-recovery-fix-a1]
  pull_request:
    branches: [feature/staging-preview]
    paths:
      - backend/src/modules/account/**
      - backend/src/modules/auth/**
      - backend/src/lib/mailer*
      - backend/src/middleware/authenticate.ts
      - backend/prisma/**
      - frontend/src/app/(auth)/**
      - .github/workflows/password-recovery-checks.yml
permissions:
  contents: read
jobs:
  recovery:
    # This integration PR uses its scoped, database-free validation workflow.
    if: github.head_ref != 'feature/app10-common-staging-integration-a1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: diewish
          POSTGRES_PASSWORD: diewish
          POSTGRES_DB: diewish_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U diewish -d diewish_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DIEWISH_ENVIRONMENT: test
      DATABASE_URL: postgresql://diewish:diewish@127.0.0.1:5432/diewish_test?schema=public
      JWT_ACCESS_SECRET: integration-access-secret-012345678901234567890123456789
      JWT_REFRESH_SECRET: integration-refresh-secret-01234567890123456789012345678
      LOG_LEVEL: silent
      BCRYPT_ROUNDS: 10
      RATE_LIMIT_MAX: 1000
      AUTH_RATE_LIMIT_MAX: 1000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npx prisma validate && npx prisma generate && npx prisma migrate deploy
        working-directory: backend
      - run: npm run lint && npm run type-check && npm run build
        working-directory: backend
      - run: node --import tsx --test src/lib/mailer.test.ts src/middleware/auth-rate-limit.test.ts src/scheduler/scheduler-trigger.test.ts src/modules/admin/admin-password-identity.provider.test.ts
        working-directory: backend
      - run: node --import tsx --test --test-concurrency=1 src/integration/password-recovery.integration.test.ts src/integration/auth-security.integration.test.ts src/integration/identity-lifecycle.integration.test.ts src/integration/admin-password-setup.integration.test.ts
        working-directory: backend
  browser:
    # This integration PR uses its scoped, database-free validation workflow.
    if: github.head_ref != 'feature/app10-common-staging-integration-a1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run type-check
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test --config playwright.password-recovery.config.ts
        working-directory: frontend
