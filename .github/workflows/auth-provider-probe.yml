name: Auth Provider Probe

on:
  push:
    branches:
      - work-auth-provider-staging
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: project-a2e260c1-839d-4f1d-b90
  WIF_PROVIDER: projects/730419163638/locations/global/workloadIdentityPools/github-actions/providers/diewish-staging
  DEPLOY_SERVICE_ACCOUNT: diewish-staging-deployer@project-a2e260c1-839d-4f1d-b90.iam.gserviceaccount.com

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud with OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Probe staging identity state read-only
        shell: bash
        run: |
          set -euo pipefail
          token="$(gcloud auth print-access-token)"

          echo "=== enabled services ==="
          gcloud services list --enabled --project "$PROJECT_ID" \
            --filter='config.name:(identitytoolkit.googleapis.com OR firebase.googleapis.com OR apikeys.googleapis.com OR securetoken.googleapis.com)' \
            --format='value(config.name)' || true

          echo "=== identity platform config ==="
          config_file="$(mktemp)"
          config_code="$(curl -sS -o "$config_file" -w '%{http_code}' \
            -H "Authorization: Bearer ${token}" \
            "https://identitytoolkit.googleapis.com/admin/v2/projects/${PROJECT_ID}/config")"
          echo "identity_config_http=${config_code}"
          if [[ "$config_code" == "200" ]]; then
            jq '{phoneEnabled:(.signIn.phoneNumber.enabled // false),anonymousEnabled:(.signIn.anonymous.enabled // false),authorizedDomains:(.authorizedDomains // [])}' "$config_file"
          else
            jq '{errorCode:(.error.code // null),errorStatus:(.error.status // null)}' "$config_file" 2>/dev/null || true
          fi

          echo "=== google provider ==="
          google_file="$(mktemp)"
          google_code="$(curl -sS -o "$google_file" -w '%{http_code}' \
            -H "Authorization: Bearer ${token}" \
            "https://identitytoolkit.googleapis.com/admin/v2/projects/${PROJECT_ID}/defaultSupportedIdpConfigs/google.com")"
          echo "google_provider_http=${google_code}"
          if [[ "$google_code" == "200" ]]; then
            jq '{enabled:(.enabled // false),hasClientId:((.clientId // "")|length>0),hasClientSecret:((.clientSecret // "")|length>0)}' "$google_file"
          else
            jq '{errorCode:(.error.code // null),errorStatus:(.error.status // null)}' "$google_file" 2>/dev/null || true
          fi

          echo "=== firebase project ==="
          firebase_file="$(mktemp)"
          firebase_code="$(curl -sS -o "$firebase_file" -w '%{http_code}' \
            -H "Authorization: Bearer ${token}" \
            "https://firebase.googleapis.com/v1beta1/projects/${PROJECT_ID}")"
          echo "firebase_project_http=${firebase_code}"
          if [[ "$firebase_code" == "200" ]]; then
            jq '{projectId,displayName,state}' "$firebase_file"
          else
            jq '{errorCode:(.error.code // null),errorStatus:(.error.status // null)}' "$firebase_file" 2>/dev/null || true
          fi

          echo "=== firebase web apps ==="
          apps_file="$(mktemp)"
          apps_code="$(curl -sS -o "$apps_file" -w '%{http_code}' \
            -H "Authorization: Bearer ${token}" \
            "https://firebase.googleapis.com/v1beta1/projects/${PROJECT_ID}/webApps")"
          echo "firebase_webapps_http=${apps_code}"
          if [[ "$apps_code" == "200" ]]; then
            jq '{count:((.apps // [])|length),apps:[(.apps // [])[]|{displayName,appId,state}]}' "$apps_file"
          else
            jq '{errorCode:(.error.code // null),errorStatus:(.error.status // null)}' "$apps_file" 2>/dev/null || true
          fi

          echo "=== api keys metadata ==="
          gcloud services api-keys list --project "$PROJECT_ID" --format='table(displayName,name)' || true
