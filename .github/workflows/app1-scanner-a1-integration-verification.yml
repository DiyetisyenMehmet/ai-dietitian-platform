name: APP1 Scanner A1 Integration Verification
on:
  push:
    branches:
      - feature/app1-scanner-accuracy-and-safety-a1
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        run: npm ci
      - name: Scanner consumption regression
        run: node --test tests/scanner-consumption-a1.test.cjs
      - name: TypeScript
        run: npm run type-check
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://example.invalid/api
          NEXT_PUBLIC_SITE_URL: https://example.invalid
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://diewish_test:diewish_test@localhost:5432/diewish_test
      JWT_ACCESS_SECRET: scanner-test-access-secret-is-not-production-value
      JWT_REFRESH_SECRET: scanner-test-refresh-secret-is-not-production-value
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend
        run: npm ci
      - name: Scanner and source safety tests
        run: node --import tsx --test src/modules/nutrition-data/open-food-facts-normalization.test.ts src/modules/nutrition-data/micronutrients.test.ts src/modules/nutrition-data/nutrition-calculator.test.ts src/modules/nutrition-data/barcode-quality.test.ts src/modules/nutrition-data/nutrition-scan-result.test.ts src/modules/nutrition-data/allergen-safety.test.ts src/modules/nutrition-data/personalization.test.ts
      - name: TypeScript
        run: npm run type-check
