name: Android launch flow polish A1
on:
  pull_request:
    branches: [feature/staging-preview]
    paths:
      - android/app/src/main/java/com/diewish/app/MainActivity.java
      - android/app/src/main/res/**
      - android/app/src/test/java/com/diewish/app/LaunchPresentationTest.java
      - frontend/src/presentation/components/branding/**
      - frontend/e2e/launch-flow.spec.ts
      - frontend/playwright.launch-flow.config.ts
      - .github/workflows/android-launch-flow-polish.yml
permissions:
  contents: read
concurrency:
  group: android-launch-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-presentation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Native launch resources and first-frame lifecycle (no APK or deployment)
        run: gradle --no-daemon -p android :app:testDebugUnitTest --tests com.diewish.app.LaunchPresentationTest --tests com.diewish.app.SessionCookiePersistenceTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-launch-test-results
          path: android/app/build/test-results/testDebugUnitTest
  web-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_BASE_URL: /api
      NEXT_TELEMETRY_DISABLED: '1'
      LAUNCH_EVIDENCE_DIR: /tmp/launch-flow-evidence
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx eslint src/presentation/components/branding/brand-artwork.tsx src/presentation/components/branding/brand-lockup.tsx src/presentation/components/branding/brand-splash.tsx e2e/launch-flow.spec.ts playwright.launch-flow.config.ts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Record actual accepted baseline with the same cold-cache harness
        env:
          LAUNCH_PHASE: before
        run: |
          set -euo pipefail
          baseline="${RUNNER_TEMP}/launch-before"
          git worktree add --detach "$baseline" 47d1107732c32aa2bef37a020a92d1900d7920ff
          ln -s "$GITHUB_WORKSPACE/frontend/node_modules" "$baseline/frontend/node_modules"
          LAUNCH_APP_DIRECTORY="$baseline/frontend" npx playwright test --config=playwright.launch-flow.config.ts --reporter=line --output=/tmp/launch-flow-evidence/before-recordings
      - name: Atomic artwork, stable header, guest routing and asset failures
        run: npx playwright test --config=playwright.launch-flow.config.ts --reporter=line --output=/tmp/launch-flow-evidence/after-recordings
      - name: Auth logic, approved web assets, backend and host routing remain unchanged
        working-directory: .
        run: git diff --exit-code "${{ github.event.pull_request.base.sha }}" HEAD -- backend frontend/public/brands frontend/next.config.ts frontend/src/app frontend/src/application frontend/src/infrastructure frontend/src/presentation/components/auth frontend/src/presentation/components/providers frontend/src/presentation/components/layout/auth-layout.tsx
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-flow-before-after-browser-evidence
          path: /tmp/launch-flow-evidence
