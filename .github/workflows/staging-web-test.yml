name: Staging Web Test

on:
  push:
    branches:
      - feature/staging-preview
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: diewish-staging-web-test
  cancel-in-progress: false

env:
  PROJECT_ID: project-a2e260c1-839d-4f1d-b90
  REGION: europe-west1
  WIF_PROVIDER: projects/730419163638/locations/global/workloadIdentityPools/github-actions/providers/diewish-staging
  DEPLOY_SERVICE_ACCOUNT: diewish-staging-deployer@project-a2e260c1-839d-4f1d-b90.iam.gserviceaccount.com
  RUNTIME_SERVICE_ACCOUNT: diewish-staging-runtime@project-a2e260c1-839d-4f1d-b90.iam.gserviceaccount.com
  BACKEND_SERVICE: diewish-backend-staging
  FRONTEND_SERVICE: diewish-frontend-staging
  ARTIFACT_REPOSITORY: diewish-staging
  DATABASE_SECRET_NAME: diewish-staging-database-url
  JWT_ACCESS_SECRET_NAME: diewish-staging-jwt-access
  JWT_REFRESH_SECRET_NAME: diewish-staging-jwt-refresh

jobs:
  expose-web-preview:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[web-preview]')) }}
    name: Deploy exact-SHA staging web preview
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Validate staging-only target
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BACKEND_SERVICE" == *-staging ]]
          [[ "$FRONTEND_SERVICE" == *-staging ]]
          [[ "$DEPLOY_SERVICE_ACCOUNT" == diewish-staging-deployer@* ]]
          [[ "$RUNTIME_SERVICE_ACCOUNT" == diewish-staging-runtime@* ]]

      - name: Authenticate to Google Cloud with OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Verify staging resources
        shell: bash
        run: |
          set -euo pipefail
          gcloud artifacts repositories describe "$ARTIFACT_REPOSITORY" \
            --project "$PROJECT_ID" \
            --location "$REGION" >/dev/null
          gcloud iam service-accounts describe "$RUNTIME_SERVICE_ACCOUNT" \
            --project "$PROJECT_ID" >/dev/null

      - name: Migrate staging database and build backend image
        shell: bash
        run: |
          set -euo pipefail
          BACKEND_IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPOSITORY}/backend:${GITHUB_SHA}"
          echo "BACKEND_IMAGE=${BACKEND_IMAGE}" >> "$GITHUB_ENV"
          gcloud builds submit \
            --no-source \
            --project "$PROJECT_ID" \
            --config .github/cloudbuild/backend-staging.yaml \
            --substitutions "_IMAGE=${BACKEND_IMAGE},_GIT_SHA=${GITHUB_SHA}" \
            --quiet

      - name: Deploy backend web preview
        shell: bash
        run: |
          set -euo pipefail
          gcloud run deploy "$BACKEND_SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --platform managed \
            --image "$BACKEND_IMAGE" \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --command=npm \
            --args=start \
            --no-invoker-iam-check \
            --cpu 1 \
            --memory 1Gi \
            --concurrency 40 \
            --timeout 120 \
            --min 0 \
            --max 2 \
            --set-env-vars "API_PREFIX=/api,CORS_ORIGIN=https://staging.invalid,TRUST_PROXY_HOPS=1,ENABLE_API_DOCS=false,LOG_LEVEL=info,JWT_ISSUER=diewish-staging,REFRESH_COOKIE_NAME=diewish_staging_refresh,REFRESH_COOKIE_SAME_SITE=lax,APP_WEB_URL=https://staging.invalid,STORAGE_PROVIDER=local,AI_PROVIDER=vertex,GOOGLE_CLOUD_PROJECT=${PROJECT_ID},VERTEX_AI_LOCATION=global,VERTEX_AI_MODEL=gemini-3.5-flash,USDA_FDC_API_KEY=DEMO_KEY,OPEN_FOOD_FACTS_USER_AGENT=Diewish-Staging/0.1" \
            --set-secrets "DATABASE_URL=${DATABASE_SECRET_NAME}:latest,JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET_NAME}:latest,JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET_NAME}:latest" \
            --quiet

          BACKEND_URL="$(gcloud run services describe "$BACKEND_SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format='value(status.url)')"
          test -n "$BACKEND_URL"
          echo "BACKEND_URL=$BACKEND_URL" >> "$GITHUB_ENV"

      - name: Build frontend image against staging backend
        shell: bash
        run: |
          set -euo pipefail
          FRONTEND_IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPOSITORY}/frontend:${GITHUB_SHA}"
          echo "FRONTEND_IMAGE=${FRONTEND_IMAGE}" >> "$GITHUB_ENV"
          gcloud builds submit \
            --no-source \
            --project "$PROJECT_ID" \
            --config .github/cloudbuild/frontend-staging.yaml \
            --substitutions "_IMAGE=${FRONTEND_IMAGE},_GIT_SHA=${GITHUB_SHA},_API_BASE_URL=/api,_API_PROXY_TARGET=${BACKEND_URL},_SITE_URL=https://staging.invalid" \
            --quiet

      - name: Deploy frontend web preview
        shell: bash
        run: |
          set -euo pipefail
          # Keep the same-origin proxy alive longer than the backend's
          # synchronous 120-second blood-test analysis request.
          gcloud run deploy "$FRONTEND_SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --platform managed \
            --image "$FRONTEND_IMAGE" \
            --no-invoker-iam-check \
            --cpu 1 \
            --memory 512Mi \
            --concurrency 80 \
            --timeout 180 \
            --min 0 \
            --max 2 \
            --quiet

          FRONTEND_URL="$(gcloud run services describe "$FRONTEND_SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format='value(status.url)')"
          test -n "$FRONTEND_URL"
          echo "FRONTEND_URL=$FRONTEND_URL" >> "$GITHUB_ENV"

      - name: Bind backend to staging frontend
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services update "$BACKEND_SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --update-env-vars "CORS_ORIGIN=${FRONTEND_URL},APP_WEB_URL=${FRONTEND_URL}" \
            --no-invoker-iam-check \
            --quiet

      - name: Verify browser web preview
        shell: bash
        run: |
          set -euo pipefail

          retry() {
            local url="$1"
            local label="$2"
            for attempt in {1..30}; do
              if curl --fail --silent --show-error "$url" >/dev/null; then
                echo "$label OK: $url"
                return 0
              fi
              sleep 2
            done
            echo "$label failed: $url"
            return 1
          }

          retry "${BACKEND_URL}/api/health" "backend health"
          retry "${FRONTEND_URL}/register" "frontend register"
          retry "${FRONTEND_URL}/api/health" "same-origin proxy"

      - name: Verify blood-test PDF end to end
        shell: bash
        run: |
          set -euo pipefail

          API_BASE="${FRONTEND_URL}/api"
          EMAIL="diewish-blood-pdf-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@example.com"
          PASSWORD="StagePdf9${GITHUB_RUN_ID}aA"
          TOKEN=""

          cleanup() {
            if [[ -n "$TOKEN" ]]; then
              curl --silent --show-error --max-time 20 \
                -X DELETE "${API_BASE}/account" \
                -H "Authorization: Bearer ${TOKEN}" \
                -H "Content-Type: application/json" \
                --data "{\"password\":\"${PASSWORD}\"}" >/dev/null || true
            fi
          }
          trap cleanup EXIT

          python3 - <<'PY'
          from pathlib import Path

          lines = [
              "Diewish Synthetic Laboratory Report",
              "Laboratory: Diewish Staging Synthetic Lab",
              "Patient: Synthetic Test User",
              "Date: 2026-09-11",
              "Test Result Unit Reference Range",
              "HGB 15.0 g/dL 13.5-17.5",
              "HCT 44.0 % 40-52",
              "MCV 89.1 fL 80-96",
              "MCH 30.4 pg 28-33",
              "MCHC 34.1 g/dL 33-36",
              "RBC 4.94 x10^12/L 4.2-6.2",
              "WBC 5.99 x10^9/L 4.5-11",
              "PLT 225 K/uL 154-386",
          ]

          def esc(text: str) -> str:
              return text.replace("\\", "\\\\").replace("(", "\\(").replace(")", "\\)")

          content = ["BT", "/F1 14 Tf", "50 750 Td", f"({esc(lines[0])}) Tj", "/F1 10 Tf"]
          for line in lines[1:]:
              content.extend(["0 -24 Td", f"({esc(line)}) Tj"])
          content.append("ET")
          stream = "\n".join(content).encode("latin-1")

          objects = [
              b"<< /Type /Catalog /Pages 2 0 R >>",
              b"<< /Type /Pages /Kids [3 0 R] /Count 1 >>",
              b"<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Resources << /Font << /F1 4 0 R >> >> /Contents 5 0 R >>",
              b"<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>",
              b"<< /Length " + str(len(stream)).encode() + b" >>\nstream\n" + stream + b"\nendstream",
          ]

          out = bytearray(b"%PDF-1.4\n")
          offsets = [0]
          for index, obj in enumerate(objects, start=1):
              offsets.append(len(out))
              out.extend(f"{index} 0 obj\n".encode())
              out.extend(obj)
              out.extend(b"\nendobj\n")
          xref = len(out)
          out.extend(f"xref\n0 {len(objects)+1}\n".encode())
          out.extend(b"0000000000 65535 f \n")
          for offset in offsets[1:]:
              out.extend(f"{offset:010d} 00000 n \n".encode())
          out.extend(
              f"trailer\n<< /Size {len(objects)+1} /Root 1 0 R >>\nstartxref\n{xref}\n%%EOF\n".encode()
          )
          Path("/tmp/diewish-synthetic-lab.pdf").write_bytes(out)
          PY

          REGISTER_RESPONSE="$(curl --fail-with-body --silent --show-error --max-time 30 \
            -X POST "${API_BASE}/auth/register" \
            -H "Content-Type: application/json" \
            --data "{\"email\":\"${EMAIL}\",\"password\":\"${PASSWORD}\",\"fullName\":\"Blood PDF E2E\"}")"
          TOKEN="$(printf '%s' "$REGISTER_RESPONSE" | jq -r '.data.tokens.accessToken // empty')"
          test -n "$TOKEN"

          for TYPE in PRIVACY_POLICY TERMS_OF_SERVICE MEDICAL_DISCLAIMER KVKK_EXPLICIT_CONSENT; do
            curl --fail-with-body --silent --show-error --max-time 30 \
              -X POST "${API_BASE}/legal/consents" \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Content-Type: application/json" \
              --data "{\"type\":\"${TYPE}\"}" >/dev/null
          done

          ANALYSIS_RESPONSE="$(curl --fail-with-body --silent --show-error --max-time 175 \
            -X POST "${API_BASE}/blood-tests/analyze-upload" \
            -H "Authorization: Bearer ${TOKEN}" \
            -F "file=@/tmp/diewish-synthetic-lab.pdf;type=application/pdf" \
            -F "label=Staging synthetic PDF E2E" \
            -F "testDate=2026-09-11")"

          printf '%s' "$ANALYSIS_RESPONSE" > /tmp/blood-analysis-response.json
          jq -e '.success == true' /tmp/blood-analysis-response.json >/dev/null
          jq -e '.data.analysis.status == "COMPLETED"' /tmp/blood-analysis-response.json >/dev/null
          jq -e '(.data.analysis.normalizedValues | length) >= 6' /tmp/blood-analysis-response.json >/dev/null
          jq -e '[.data.analysis.normalizedValues[].biomarkerCode] | (index("HGB") != null) and (index("HCT") != null) and (index("MCV") != null) and (index("RBC") != null) and (index("WBC") != null) and (index("PLT") != null)' /tmp/blood-analysis-response.json >/dev/null
          jq -e '[.data.analysis.normalizedValues[] | select(.referenceRange.source == "LAB_REPORT")] | length >= 6' /tmp/blood-analysis-response.json >/dev/null

          echo "blood-test PDF E2E OK: upload -> consent/auth -> PDF validation -> extraction -> normalization -> Vertex analysis -> same-origin proxy"

      - name: Web preview summary
        shell: bash
        run: |
          {
            echo "## Diewish exact-SHA staging web test"
            echo ""
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Frontend: ${FRONTEND_URL}"
            echo "- Backend: ${BACKEND_URL}"
            echo "- Browser API: ${FRONTEND_URL}/api"
            echo "- Blood-test PDF E2E: passed through same-origin staging proxy"
            echo "- APK: intentionally not built in this workflow"
          } >> "$GITHUB_STEP_SUMMARY"
