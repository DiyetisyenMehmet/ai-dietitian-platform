name: Cross-platform QA Authenticated All
# Protected staging run: credentials are inherited only by the reusable QA workflow.

on:
  push:
    branches: [feature/workmode4-crossplatform-qa-infra-a1]
    paths: [".github/workflows/crossplatform-qa-authenticated.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authenticated-all:
    if: github.ref == 'refs/heads/feature/workmode4-crossplatform-qa-infra-a1'
    uses: ./.github/workflows/crossplatform-qa-infra.yml
    with:
      authenticated: true
      platform: all
    secrets: inherit
