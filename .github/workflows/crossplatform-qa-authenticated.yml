name: Cross-platform QA Authenticated All
# Protected staging run: credentials are inherited only by the reusable QA workflow.
# Settle hydration before measuring private-value masks; never ignore capture-time changes.
# Accept only WebKit's declaration-free screenshot plumbing; audit private-value geometry.
# Hide private visual layers without covering the card labels above them.
# Restore original inline styles exactly; validate both engines before all runtime jobs.

# Settle overlay fonts before arming; cover rounded native viewport dimensions.
# Audit actual font set/status/geometry; bound Simulator launch readiness.
# Refuse preparation-shield PNGs; settle evidence requests before measuring.
# Keep contract tests dependency-free; test shield PNGs in real DOM fixtures.
# Preload declared faces; use XCTest as the sole native iOS launch owner.
# Only unchanged geometry and unused-face cache reset after exact empty style are harmless.
# Assert captured private pixels and restored DOM, not unused font-cache residency.
on:
  push:
    branches: [feature/workmode4-crossplatform-qa-infra-a1]
    paths: [".github/workflows/crossplatform-qa-authenticated.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authenticated-all:
    if: github.ref == 'refs/heads/feature/workmode4-crossplatform-qa-infra-a1'
    uses: ./.github/workflows/crossplatform-qa-infra.yml
    with:
      authenticated: true
      platform: ios
      android_source_ref: d69502cd9c238c7e4958c6a21386de877b4c37d8
    secrets: inherit

  authenticated-sync:
    # Paired sync resumes only after the final all-platform smoke.
    if: false
    needs: authenticated-all
    strategy:
      fail-fast: false
      matrix:
        direction: [sync-android-to-web, sync-web-to-android]
    uses: ./.github/workflows/crossplatform-qa-infra.yml
    with:
      authenticated: true
      platform: android
      android_source_ref: d69502cd9c238c7e4958c6a21386de877b4c37d8
      android_operation: ${{ matrix.direction }}
    secrets: inherit

# Inspect private XCTest test details using fixed diagnostic codes only.
