name: Build dark dashboard parity assets

on:
  push:
    branches:
      - feature/staging-preview

permissions:
  contents: write

jobs:
  build-dark-parity-assets:
    if: github.event.head_commit.message == 'run-dark-parity-assets'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: feature/staging-preview
          fetch-depth: 0

      - name: Install deterministic image tooling
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check opencv-python-headless==4.13.0.92

      - name: Build light-geometry dark assets and remove embedded chevrons
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import cv2
          import numpy as np

          root = Path("frontend/public/images/dashboard/references")

          def load(name):
              image = cv2.imread(str(root / name))
              if image is None:
                  raise SystemExit(f"Could not read {name}")
              return image

          # FOOD: preserve the already-approved dark card geometry; only remove
          # the raster chevron so the exact live light-mode Chevron can be used.
          src = load("food-dark-final.jpg")
          food = src[240:594, 33:1502].copy()
          mask = np.zeros(food.shape[:2], np.uint8)
          roi = food[125:245, 1340:1469]
          b, g, r = cv2.split(roi)
          sel = (
              (g > 105)
              & ((g.astype(int) - r.astype(int)) > 50)
              & ((g.astype(int) - b.astype(int)) > 15)
          )
          m = sel.astype(np.uint8) * 255
          tmp = np.zeros_like(m)
          tmp[:, 45:125] = m[:, 45:125]
          tmp = cv2.dilate(tmp, np.ones((5, 5), np.uint8), iterations=1)
          mask[125:245, 1340:1469] = tmp
          food = cv2.inpaint(food, mask, 5, cv2.INPAINT_NS)
          cv2.imwrite(str(root / "food-dark-parity.png"), food, [cv2.IMWRITE_PNG_COMPRESSION, 3])

          # BLOOD: map the final dark artwork to the exact light-card geometry
          # (1603x460), then remove the embedded circular chevron treatment.
          src = load("blood-dark-final.jpg")
          blood = src[205:615, 37:1499]
          blood = cv2.resize(blood, (1603, 460), interpolation=cv2.INTER_LANCZOS4)
          mask = np.zeros(blood.shape[:2], np.uint8)
          cv2.ellipse(mask, (1537, 233), (48, 50), 0, 0, 360, 255, -1)
          mask = cv2.dilate(mask, np.ones((3, 3), np.uint8), iterations=1)
          blood = cv2.inpaint(blood, mask, 18, cv2.INPAINT_NS)
          cv2.imwrite(str(root / "blood-dark-parity.png"), blood, [cv2.IMWRITE_PNG_COMPRESSION, 3])

          # PROGRESS: map the final dark artwork to the exact light-card geometry
          # (1598x405), then remove only the embedded white raster chevron.
          src = load("progress-dark-final.jpg")
          progress = src[248:602, 42:1494]
          progress = cv2.resize(progress, (1598, 405), interpolation=cv2.INTER_LANCZOS4)
          mask = np.zeros(progress.shape[:2], np.uint8)
          roi = progress[135:260, 1470:1598]
          b, g, r = cv2.split(roi)
          mx = np.maximum(np.maximum(b, g), r)
          mn = np.minimum(np.minimum(b, g), r)
          sel = (mx > 130) & ((mx - mn) < 45)
          m = sel.astype(np.uint8) * 255
          tmp = np.zeros_like(m)
          tmp[:, 30:115] = m[:, 30:115]
          tmp = cv2.dilate(tmp, np.ones((5, 5), np.uint8), iterations=1)
          mask[135:260, 1470:1598] = tmp
          progress = cv2.inpaint(progress, mask, 6, cv2.INPAINT_NS)
          cv2.imwrite(str(root / "progress-dark-parity.png"), progress, [cv2.IMWRITE_PNG_COMPRESSION, 3])
          PY

          echo '4f44133a0384a84a1ec93c52561ef77bae58429fbe8fa63c521e7eeff30afb5a  frontend/public/images/dashboard/references/food-dark-parity.png' | sha256sum -c -
          echo '6ee25aded0d8edf16fab56d441102df176c82d51f00fd9f6b03b4ad91ed5f0fa  frontend/public/images/dashboard/references/blood-dark-parity.png' | sha256sum -c -
          echo '3b4dac8cd28992fc4f9ced46b99625feaf2cd25fb0bf0af35aabf26a7943e314  frontend/public/images/dashboard/references/progress-dark-parity.png' | sha256sum -c -

      - name: Commit parity assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Diewish Staging Automation"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/public/images/dashboard/references/*-dark-parity.png
          if git diff --cached --quiet; then
            echo "Parity assets already match expected hashes."
            exit 0
          fi
          git commit -m "chore(dashboard): add dark light-parity assets"
          git push origin HEAD:feature/staging-preview
