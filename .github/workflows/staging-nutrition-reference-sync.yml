name: Staging Nutrition Reference Sync

on:
  push:
    branches:
      - feature/staging-preview
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: diewish-staging-nutrition-reference-sync
  cancel-in-progress: false

env:
  PROJECT_ID: project-a2e260c1-839d-4f1d-b90
  WIF_PROVIDER: projects/730419163638/locations/global/workloadIdentityPools/github-actions/providers/diewish-staging
  DEPLOY_SERVICE_ACCOUNT: diewish-staging-deployer@project-a2e260c1-839d-4f1d-b90.iam.gserviceaccount.com
  DIRECT_DATABASE_SECRET_NAME: diewish-staging-direct-database-url

jobs:
  sync-reference-nutrition:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[nutrition-ref-sync]')) }}
    name: Sync CIQUAL and CoFID into isolated staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Validate staging-only target
        shell: bash
        run: |
          set -euo pipefail
          test "$PROJECT_ID" = "project-a2e260c1-839d-4f1d-b90"
          [[ "$DEPLOY_SERVICE_ACCOUNT" == diewish-staging-deployer@* ]]
          test "$DIRECT_DATABASE_SECRET_NAME" = "diewish-staging-direct-database-url"

      - name: Wait for exact-SHA staging CI gates
        if: ${{ github.event_name == 'push' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          required=("Hardening CI" "Staging Config CI")
          for attempt in {1..180}; do
            runs="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=100")"
            ready=1
            for workflow_name in "${required[@]}"; do
              record="$(jq -c --arg name "${workflow_name}" '
                [.workflow_runs[]
                  | select(.name == $name)
                  | {status, conclusion, run_attempt, updated_at}]
                | sort_by(.run_attempt, .updated_at)
                | last // empty
              ' <<<"${runs}")"
              if [[ -z "${record}" ]]; then
                ready=0
                continue
              fi
              status="$(jq -r '.status' <<<"${record}")"
              conclusion="$(jq -r '.conclusion // ""' <<<"${record}")"
              if [[ "${status}" == "completed" && "${conclusion}" != "success" ]]; then
                echo "Pre-sync gate failed: ${workflow_name} => ${conclusion}" >&2
                exit 1
              fi
              if [[ "${status}" != "completed" || "${conclusion}" != "success" ]]; then
                ready=0
              fi
            done
            if [[ "${ready}" == "1" ]]; then
              exit 0
            fi
            sleep 5
          done
          echo "Timed out waiting for exact-SHA staging CI gates." >&2
          exit 1

      - name: Authenticate to isolated staging Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Verify isolated staging database secret
        shell: bash
        run: |
          set -euo pipefail
          gcloud secrets describe "$DIRECT_DATABASE_SECRET_NAME" \
            --project "$PROJECT_ID" >/dev/null

      - name: Run isolated staging reference sync in Cloud Build
        shell: bash
        run: |
          set -euo pipefail
          SYNC_BUILD_ID="$(gcloud builds submit \
            --no-source \
            --project "$PROJECT_ID" \
            --config .github/cloudbuild/nutrition-reference-sync-staging.yaml \
            --substitutions "_GIT_SHA=$GITHUB_SHA" \
            --async \
            --format='value(id)' \
            --quiet)"
          test -n "$SYNC_BUILD_ID"
          echo "SYNC_BUILD_ID=$SYNC_BUILD_ID" >> "$GITHUB_ENV"

          for attempt in {1..240}; do
            build_status="$(gcloud builds describe "$SYNC_BUILD_ID" \
              --project "$PROJECT_ID" \
              --region=global \
              --format='value(status)')"
            case "$build_status" in
              SUCCESS)
                echo "Nutrition reference Cloud Build succeeded."
                exit 0
                ;;
              FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED)
                echo "Nutrition reference Cloud Build failed with status: $build_status" >&2
                gcloud builds describe "$SYNC_BUILD_ID" \
                  --project "$PROJECT_ID" \
                  --region=global \
                  --format='yaml(status,statusDetail,failureInfo,steps.id,steps.status)' || true
                echo "---- Cloud Build logs ----" >&2
                gcloud builds log "$SYNC_BUILD_ID" \
                  --project "$PROJECT_ID" \
                  --region=global \
                  --stream || true
                exit 1
                ;;
            esac
            sleep 5
          done
          echo "Timed out waiting for nutrition reference Cloud Build." >&2
          exit 1

      - name: Reference sync summary
        shell: bash
        run: |
          {
            echo "## Diewish staging nutrition reference sync"
            echo ""
            echo "- Environment: isolated staging only"
            echo "- Commit: $GITHUB_SHA"
            echo "- Cloud Build: $SYNC_BUILD_ID"
            echo "- Sources: ANSES-CIQUAL 2025 + UK CoFID 2021"
            echo "- Database secret: injected only inside Cloud Build"
            echo "- Production: not touched"
          } >> "$GITHUB_STEP_SUMMARY"
