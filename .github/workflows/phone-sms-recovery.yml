name: Phone SMS recovery A4 checks
on:
  pull_request:
    branches: [feature/app11-sms-recovery-foundation-a4]
permissions:
  contents: read
concurrency:
  group: phone-sms-recovery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sms-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app11
          POSTGRES_PASSWORD: app11
          POSTGRES_DB: app11_a4_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U app11 -d app11_a4_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DIEWISH_ENVIRONMENT: test
      DATABASE_URL: postgresql://app11:app11@127.0.0.1:5432/app11_a4_test?schema=public
      APP11_ALLOW_DISPOSABLE_DB: '1'
      JWT_ACCESS_SECRET: synthetic-access-secret-00000000000000
      JWT_REFRESH_SECRET: synthetic-refresh-secret-00000000000000
      BCRYPT_ROUNDS: '10'
      LOG_LEVEL: silent
      AUTH_RATE_LIMIT_MAX: '1000'
      RATE_LIMIT_MAX: '1000'
      ACCOUNT_SAFE_LINKING_ENABLED: 'false'
      PHONE_PASSWORD_AUTH_ENABLED: 'false'
      PHONE_SMS_RECOVERY_ENABLED: 'false'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma validate && npx prisma generate
      - name: Only new additive A4 migration, disposable data preservation
        shell: bash
        run: |
          set -euo pipefail
          pending="${RUNNER_TEMP}/app11-a4-migration"
          migration="prisma/migrations/20261018093000_phone_sms_recovery"
          export APP11_A4_BASELINE_SCHEMA="${RUNNER_TEMP}/app11-a4-before.prisma"
          export APP11_A4_SNAPSHOT_FILE="${RUNNER_TEMP}/app11-a4-snapshot.json"
          mv "$migration" "$pending"
          trap 'if test -d "$pending"; then mv "$pending" "$migration"; fi' EXIT
          npx prisma migrate deploy
          node scripts/app11-a4-migration-check.mjs seed
          npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel "$APP11_A4_BASELINE_SCHEMA" --script > "${RUNNER_TEMP}/app11-a4-drift-before.sql"
          mv "$pending" "$migration"
          npx prisma migrate deploy
          node scripts/app11-a4-migration-check.mjs verify
      - run: npm run type-check && npm run lint && npm run build
      - name: Only new A4 recovery behavior, against preserved PR49/58/59 foundation
        run: node --import tsx --test --test-concurrency=1 src/integration/phone-sms-recovery.integration.test.ts
      - name: Existing SQL-managed drift remains unchanged
        shell: bash
        run: |
          set -euo pipefail
          npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --script > "${RUNNER_TEMP}/app11-a4-drift-after.sql"
          cmp "${RUNNER_TEMP}/app11-a4-drift-before.sql" "${RUNNER_TEMP}/app11-a4-drift-after.sql"
  recovery-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npx eslint src/app/phone-password-recovery/page.tsx src/infrastructure/identity/sms-recovery-client.ts src/presentation/components/auth/sms-recovery-entry.tsx src/presentation/components/auth/phone-password-flow.tsx src/presentation/components/auth/route-guard.tsx next.config.ts e2e/phone-sms-recovery.spec.ts playwright.sms-recovery.config.ts
      - run: npx playwright install --with-deps chromium
      - name: Only new recovery screen behavior; synthetic provider, no SMS/device account
        run: npx playwright test --config playwright.sms-recovery.config.ts --reporter=line
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: sms-recovery-browser-failure
          path: frontend/test-results
