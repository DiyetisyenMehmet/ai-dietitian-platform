name: Android CI

on:
  push:
    branches:
      - fix/production-hardening
      - feature/integrated-test-build
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build debug APK
        run: gradle --no-daemon -p android :app:assembleDebug

      - name: Stamp APK artifact
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::7}"
          mkdir -p android/app/build/traceable-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk "android/app/build/traceable-apk/Diewish-debug-${short_sha}.apk"
          sha256sum "android/app/build/traceable-apk/Diewish-debug-${short_sha}.apk" > "android/app/build/traceable-apk/Diewish-debug-${short_sha}.sha256"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: diewish-debug-apk-${{ github.run_number }}
          path: android/app/build/traceable-apk/
          if-no-files-found: error
          retention-days: 14
