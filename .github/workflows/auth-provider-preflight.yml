name: Auth Provider Preflight

on:
  push:
    branches:
      - feature/staging-preview
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: project-a2e260c1-839d-4f1d-b90
  WIF_PROVIDER: projects/730419163638/locations/global/workloadIdentityPools/github-actions/providers/diewish-staging
  DEPLOY_SERVICE_ACCOUNT: diewish-staging-deployer@project-a2e260c1-839d-4f1d-b90.iam.gserviceaccount.com

jobs:
  preflight:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud with OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Inspect identity provider state
        shell: bash
        run: |
          set -euo pipefail
          token="$(gcloud auth print-access-token)"

          echo "=== required API state ==="
          for service in identitytoolkit.googleapis.com firebase.googleapis.com apikeys.googleapis.com securetoken.googleapis.com; do
            state="$(gcloud services list --enabled --project "$PROJECT_ID" --filter="config.name=${service}" --format='value(config.name)' 2>/dev/null || true)"
            if [[ "$state" == "$service" ]]; then
              echo "${service}=enabled"
            else
              echo "${service}=not-enabled-or-not-readable"
            fi
          done

          probe() {
            local label="$1"
            local url="$2"
            local file
            local code
            file="$(mktemp)"
            code="$(curl -sS -o "$file" -w '%{http_code}' -H "Authorization: Bearer ${token}" "$url")"
            echo "${label}_http=${code}"
            if [[ "$code" != "200" ]]; then
              jq -r '(.error.status // "UNKNOWN") + ": " + (.error.message // "no message")' "$file" | sed -E 's/[A-Za-z0-9_-]{20,}/[redacted]/g' | head -c 800
              echo
            fi
            PROBE_FILE="$file"
            PROBE_CODE="$code"
          }

          probe identity_config "https://identitytoolkit.googleapis.com/admin/v2/projects/${PROJECT_ID}/config"
          if [[ "$PROBE_CODE" == "200" ]]; then
            jq '{phoneEnabled:(.signIn.phoneNumber.enabled // false),anonymousEnabled:(.signIn.anonymous.enabled // false),authorizedDomainCount:((.authorizedDomains // [])|length)}' "$PROBE_FILE"
          fi

          probe google_provider "https://identitytoolkit.googleapis.com/admin/v2/projects/${PROJECT_ID}/defaultSupportedIdpConfigs/google.com"
          if [[ "$PROBE_CODE" == "200" ]]; then
            jq '{enabled:(.enabled // false),hasClientId:((.clientId // "")|length>0),hasClientSecret:((.clientSecret // "")|length>0)}' "$PROBE_FILE"
          fi

          probe firebase_project "https://firebase.googleapis.com/v1beta1/projects/${PROJECT_ID}"

          probe firebase_webapps "https://firebase.googleapis.com/v1beta1/projects/${PROJECT_ID}/webApps"
          if [[ "$PROBE_CODE" == "200" ]]; then
            jq '{webAppCount:((.apps // [])|length)}' "$PROBE_FILE"
          fi

          key_output="$(gcloud services api-keys list --project "$PROJECT_ID" --format='value(name)' 2>&1 || true)"
          if grep -qiE 'PERMISSION_DENIED|permission' <<<"$key_output"; then
            echo "api_keys=permission-denied"
          else
            key_count="$(grep -c . <<<"$key_output" || true)"
            echo "api_key_count=${key_count}"
          fi
