name: Phone password registration A3 checks
on:
  push:
    branches: [feature/app11-phone-password-registration-a3]
  pull_request:
    branches: [feature/app11-safe-account-linking-a2]
permissions:
  contents: read
concurrency:
  group: phone-password-a3-${{ github.ref }}
  cancel-in-progress: true
jobs:
  phone-password:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app11
          POSTGRES_PASSWORD: app11
          POSTGRES_DB: app11_a3_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app11 -d app11_a3_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DIEWISH_ENVIRONMENT: test
      DATABASE_URL: postgresql://app11:app11@127.0.0.1:5432/app11_a3_test?schema=public
      APP11_ALLOW_DISPOSABLE_DB: '1'
      JWT_ACCESS_SECRET: synthetic-access-secret-00000000000000
      JWT_REFRESH_SECRET: synthetic-refresh-secret-00000000000000
      BCRYPT_ROUNDS: '10'
      LOG_LEVEL: silent
      AUTH_RATE_LIMIT_MAX: '1000'
      RATE_LIMIT_MAX: '1000'
      ACCOUNT_SAFE_LINKING_ENABLED: 'false'
      PHONE_PASSWORD_AUTH_ENABLED: 'false'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma validate && npx prisma generate
      - name: Verify only A3 additive migration on existing fixtures
        shell: bash
        run: |
          set -euo pipefail
          pending="${RUNNER_TEMP}/app11-a3-migration"
          migration="prisma/migrations/20261017210000_phone_password_registration"
          export APP11_A3_BASELINE_SCHEMA="${RUNNER_TEMP}/app11-a3-before.prisma"
          export APP11_A3_SNAPSHOT_FILE="${RUNNER_TEMP}/app11-a3-snapshot.json"
          mv "$migration" "$pending"
          trap 'if test -d "$pending"; then mv "$pending" "$migration"; fi' EXIT
          npx prisma migrate deploy
          node scripts/app11-a3-migration-check.mjs seed
          npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel "$APP11_A3_BASELINE_SCHEMA" --script > "${RUNNER_TEMP}/app11-a3-drift-before.sql"
          mv "$pending" "$migration"
          npx prisma migrate deploy
          node scripts/app11-a3-migration-check.mjs verify
      - run: npm run type-check && npm run lint && npm run build
      - name: Only new A3 registration and security tests
        run: node --import tsx --test --test-concurrency=1 src/integration/phone-password-registration.integration.test.ts
      - name: Inherited SQL-managed schema drift remains unchanged
        shell: bash
        run: |
          set -euo pipefail
          npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --script > "${RUNNER_TEMP}/app11-a3-drift-after.sql"
          cmp "${RUNNER_TEMP}/app11-a3-drift-before.sql" "${RUNNER_TEMP}/app11-a3-drift-after.sql"
      - name: Prepare isolated compatibility preview with pinned PR49
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin e5291d66b8537bcc24f3dc3053869e9883b14bb6 de3bbc689d8e5f8b6bdfa74e93f6ba6877fb79b5
          python3 scripts/app11-a2-pr49-preview.py --source "$GITHUB_WORKSPACE" --output "${RUNNER_TEMP}/app11-a3-pr49-preview"
      - name: New A3 tests with PR49 reset and session protections
        shell: bash
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/app11-a3-pr49-preview/backend"
          npm ci
          npx prisma validate && npx prisma generate && npx prisma migrate deploy
          npm run type-check
          node --import tsx --test --test-concurrency=1 src/integration/phone-password-registration.integration.test.ts
  phone-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npx eslint src/app/phone-auth/page.tsx src/infrastructure/identity/identity-client.ts src/presentation/components/auth/phone-password-flow.tsx src/presentation/components/auth/route-guard.tsx next.config.ts e2e/phone-password-registration.spec.ts playwright.phone-password.config.ts
      - run: npx playwright install --with-deps chromium
      - name: New A3 synthetic browser flows only
        run: npx playwright test --config playwright.phone-password.config.ts --reporter=line
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: phone-password-browser-failure
          path: frontend/test-results
