name: Nutrition acceptance diagnostics
on:
  push:
    branches:
      - feature/workmode-nutrition-staging-acceptance-blockers-a1
      - feature/staging-preview
    paths:
      - .github/workflows/nutrition-acceptance-diagnostics.yml
      - scripts/nutrition-acceptance-log-reader.py
      - scripts/nutrition-acceptance-log-reader.test.py
      - frontend/e2e/staging-nutrition-disabled-sanity.spec.ts
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify bounded metadata and refusal guards
        run: python3 scripts/nutrition-acceptance-log-reader.test.py
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check affected browser test without AI requests
        working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit
          npx eslint e2e/staging-nutrition-disabled-sanity.spec.ts
  read-staging-metadata:
    # Cloud access remains restricted to the existing protected staging ref.
    # Feature-branch validation never authenticates to Google Cloud.
    if: github.ref == 'refs/heads/feature/staging-preview'
    needs: verify-diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: project-a2e260c1-839d-4f1d-b90
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/730419163638/locations/global/workloadIdentityPools/github-actions/providers/diewish-staging
          service_account: diewish-staging-deployer@project-a2e260c1-839d-4f1d-b90.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
      - name: Read only serving flags and bounded historical failure metadata
        run: python3 scripts/nutrition-acceptance-log-reader.py
