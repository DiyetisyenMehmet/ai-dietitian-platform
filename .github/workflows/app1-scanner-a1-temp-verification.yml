name: APP1 Scanner A1 Verification
on:
  push:
    branches:
      - feature/app1-scanner-accuracy-and-safety-a1
permissions:
  contents: read
jobs:
  scanner-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Scanner consumption and mineral unit tests
        run: node --test tests/scanner-consumption-a1.test.cjs
      - name: Existing product quality/display tests
        run: node --test src/presentation/components/meals/product-data-display.test.ts
      - name: TypeScript
        run: npm run type-check
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://example.invalid/api
          NEXT_PUBLIC_SITE_URL: https://example.invalid
