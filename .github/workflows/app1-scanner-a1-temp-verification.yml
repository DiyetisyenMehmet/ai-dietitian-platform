name: APP1 Scanner A1 Verification
on:
  push:
    branches:
      - feature/app1-scanner-accuracy-and-safety-a1
permissions:
  contents: read
jobs:
  scanner-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Scanner consumption and mineral unit tests
        run: node --test tests/scanner-consumption-a1.test.cjs
      - name: TypeScript
        run: npm run type-check
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://example.invalid/api
          NEXT_PUBLIC_SITE_URL: https://example.invalid
  backend-mineral-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend
        run: npm ci
      - name: Verify OFF volume and mg/L normalization
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://diewish_test:diewish_test@localhost:5432/diewish_test
          JWT_ACCESS_SECRET: scanner-test-access-secret-is-not-production-value
          JWT_REFRESH_SECRET: scanner-test-refresh-secret-is-not-production-value
        run: node --import tsx --test src/modules/nutrition-data/open-food-facts-normalization.test.ts src/modules/nutrition-data/micronutrients.test.ts
      - name: Backend TypeScript
        run: npm run type-check
