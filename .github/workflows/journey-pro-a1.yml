name: Journey pro A1
on:
  pull_request:
    branches: [feature/staging-preview]
    paths:
      - frontend/src/application/health/journey-*.ts
      - frontend/src/application/health/use-journey-engine.ts
      - frontend/src/application/health/daily-journey.ts
      - frontend/src/application/health/nutrition-plan-store.ts
      - frontend/src/application/meals/meals-store.ts
      - frontend/src/presentation/components/dashboard/daily-journey-section.tsx
      - frontend/tests/journey-*.test.cjs
      - frontend/e2e/journey-pro.spec.ts
      - frontend/playwright.journey-pro.config.ts
      - .github/workflows/journey-pro-a1.yml
permissions:
  contents: read
concurrency:
  group: journey-pro-${{ github.ref }}
  cancel-in-progress: true
jobs:
  journey-pro:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run type-check
      - run: node --test tests/journey-engine.test.cjs tests/journey-plan.test.cjs tests/journey-sources.test.cjs tests/journey-compact-ui.test.cjs tests/journey-dashboard-activation.test.cjs tests/nutrition-plan-generation.test.cjs tests/nutrition-plan-performance-a1.test.cjs
      - name: Use installed runner Chrome, fall back to Playwright browser
        timeout-minutes: 3
        shell: bash
        run: |
          journey_chrome="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$journey_chrome" ]; then
            echo "JOURNEY_BROWSER_EXECUTABLE=$journey_chrome" >> "$GITHUB_ENV"
            "$journey_chrome" --version
          else
            npx playwright install --with-deps chromium
          fi
      - run: npx playwright test --config=playwright.journey-pro.config.ts --reporter=line,html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: journey-pro-a1-real-react-evidence
          path: |
            frontend/test-results
            frontend/playwright-report
          if-no-files-found: error
