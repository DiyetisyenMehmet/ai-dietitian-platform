name: APP1 Nutrition A1 Temporary Verification
on:
  push:
    branches:
      - feature/app1-nutrition-home-reference-a1
permissions:
  contents: read
jobs:
  verify-frontend:
    if: github.repository == 'DiyetisyenMehmet/ai-dietitian-platform'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Run nutrition data accuracy tests
        run: node --test tests/nutrition-home-a1-data.test.cjs
      - name: TypeScript typecheck
        run: npm run type-check
      - name: Build frontend without live service calls
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://example.invalid/api
          NEXT_PUBLIC_SITE_URL: https://example.invalid
