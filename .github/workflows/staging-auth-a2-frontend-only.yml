name: Auth A2 Split-Aware Frontend-Only Staging Release
# Push/PR events run offline guards only. Cloud access requires workflow_dispatch.
on:
  push:
    branches: [feature/staging-preview]
    paths:
      - .github/workflows/staging-auth-a2-frontend-only.yml
      - .github/cloudbuild/frontend-staging.yaml
      - scripts/staging-frontend-release.py
      - scripts/staging-frontend-release.test.py
  pull_request:
    branches: [feature/staging-preview]
    paths:
      - .github/workflows/staging-auth-a2-frontend-only.yml
      - .github/cloudbuild/frontend-staging.yaml
      - scripts/staging-frontend-release.py
      - scripts/staging-frontend-release.test.py
  workflow_dispatch:
    inputs:
      mode:
        description: "#103: inspect reads only; release changes only staging frontend"
        type: choice
        options: [inspect, release]
        default: inspect
permissions:
  contents: read
  actions: read
concurrency:
  group: diewish-staging-preview
  cancel-in-progress: false
jobs:
  offline-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify source, build, split and rollback guards without cloud access
        run: python3 scripts/staging-frontend-release.test.py
  cutover:
    needs: offline-guards
    permissions:
      contents: read
      actions: read
      id-token: write
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'DiyetisyenMehmet/ai-dietitian-platform' && github.ref == 'refs/heads/feature/staging-preview' }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment: staging
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: ${{ inputs.mode == 'release' }}
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Prepare existing Playwright for read-only live login verification
        if: ${{ inputs.mode == 'release' }}
        timeout-minutes: 8
        working-directory: frontend
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            grep -Fq 'https://archive.ubuntu.com/ubuntu/' /etc/apt/apt-mirrors.txt
            sudo sed -i '/azure[.]archive[.]ubuntu[.]com/d' /etc/apt/apt-mirrors.txt
          fi
          npx playwright install --with-deps chromium
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/730419163638/locations/global/workloadIdentityPools/github-actions/providers/diewish-staging
          service_account: diewish-staging-deployer@project-a2e260c1-839d-4f1d-b90.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: project-a2e260c1-839d-4f1d-b90
      - name: Fresh read-only preflight or explicitly requested frontend release
        env:
          RELEASE_MODE: ${{ inputs.mode }}
        run: python3 scripts/staging-frontend-release.py "$RELEASE_MODE"
      - name: Retain sanitized source, runtime, rollback and login evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-frontend-journey-release-${{ github.run_number }}
          path: ${{ runner.temp }}/frontend-release-evidence/
          if-no-files-found: ignore
          retention-days: 14
