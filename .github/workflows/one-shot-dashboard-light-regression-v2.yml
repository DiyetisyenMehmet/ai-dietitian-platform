name: One-shot dashboard light regression repair

on:
  push:
    branches:
      - feature/staging-preview

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: feature/staging-preview
          fetch-depth: 0

      - name: Prepare image tooling
        run: python -m pip install --disable-pip-version-check pillow numpy opencv-python-headless

      - name: Apply regression repair
        run: python .github/scripts/one-shot-dashboard-light-regression.py

      - name: Remove one-shot helpers
        run: |
          rm -f .github/workflows/one-shot-dashboard-light-regression.yml
          rm -f .github/workflows/one-shot-dashboard-light-regression-v2.yml
          rm -f .github/scripts/one-shot-dashboard-light-regression.py

      - name: Commit staging-only repair
        run: |
          git config user.name "Diewish Staging Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(dashboard): remove chevron backdrop and refine coach leaf [deploy-staging]"
          git push origin HEAD:feature/staging-preview
